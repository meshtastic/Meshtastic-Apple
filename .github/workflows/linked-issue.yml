name: Linked issue

# Every pull request starts from an issue, so maintainers can weigh the idea before anyone spends
# time on it. The PR links its issue with a closing keyword ("Fixes #123"), which also lists it in
# the issue's Development section. The issue also needs the `approved` label, which only
# maintainers can add, unless it's a bug report (labeled `bug`).
#
# Maintainers and bots are exempt, and a maintainer can add `skip-issue-check` to a PR that
# doesn't need an issue, such as a typo fix. When an issue gains or loses `approved` or `bug`, its
# open PRs' last check runs again, so approving the issue turns the PR green without a push.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const maintainers = ['OWNER', 'MEMBER', 'COLLABORATOR']
            if (maintainers.includes(pr.author_association) || pr.user.type === 'Bot') {
              core.info(`Opened by ${pr.user.login} (${pr.author_association}); no linked issue needed.`)
              return
            }
            if (pr.labels.some((l) => l.name === 'skip-issue-check')) {
              core.info('A maintainer added skip-issue-check.')
              return
            }
            const res = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){
                 closingIssuesReferences(first:10){nodes{number repository{nameWithOwner} labels(first:30){nodes{name}}}}}}}`,
              { owner, repo, number: pr.number },
            )
            const linked = res.repository.pullRequest.closingIssuesReferences.nodes
            const problems = []
            // Only this repository's maintainers can approve, so an issue elsewhere doesn't count.
            const here = `${owner}/${repo}`.toLowerCase()
            for (const issue of linked.filter((i) => i.repository.nameWithOwner.toLowerCase() !== here)) {
              problems.push(`${issue.repository.nameWithOwner}#${issue.number} is in another repository; link an issue in ${owner}/${repo}.`)
            }
            const issues = linked.filter((i) => i.repository.nameWithOwner.toLowerCase() === here)
            if (!issues.length) {
              problems.push(
                'No linked issue. Open an issue describing the change first, so maintainers can review the idea, ' +
                'then add "Fixes #<issue>" to this pull request\'s description.',
              )
            }
            for (const issue of issues) {
              const names = issue.labels.nodes.map((l) => l.name)
              if (!names.includes('bug') && !names.includes('approved')) {
                problems.push(`#${issue.number} hasn't been approved by a maintainer yet; it needs the approved label (bug reports don't).`)
              }
            }
            if (problems.length) core.setFailed(problems.join('\n'))
            else core.info(`Linked: ${issues.map((i) => '#' + i.number).join(', ')}.`)

  # An issue's approval changed: run its open PRs' last check again.
  recheck:
    if: "${{ github.event_name == 'issues' && (github.event.label.name == 'approved' || github.event.label.name == 'bug') }}"
    runs-on: ubuntu-latest
    # Only this job re-runs checks; the pull request job stays read-only.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const res = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){
                 closedByPullRequestsReferences(first:10,includeClosedPrs:false){nodes{number headRefOid state}}}}}`,
              { owner, repo, number: context.payload.issue.number },
            )
            const prs = res.repository.issue.closedByPullRequestsReferences.nodes.filter((p) => p.state === 'OPEN')
            for (const pr of prs) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: pr.headRefOid, event: 'pull_request', per_page: 50 })
              const last = runs.data.workflow_runs.find((r) => r.name === 'Linked issue')
              if (!last) continue
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: last.id }).catch((e) => core.warning(`#${pr.number}: ${e.message}`))
              core.info(`Re-ran the check on #${pr.number}`)
            }
