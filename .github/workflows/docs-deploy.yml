name: Deploy Docs

# Builds and validates the docs on pull requests and every push to main, but
# does NOT publish to GitHub Pages. Only tagged releases publish (see
# docs-release.yml, on v*.*.*), so changes merged to main never overwrite the
# released docs site between releases. The live site reflects the most recent
# vX.Y.Z tag.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-snapshots:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Regenerate doc snapshots
        run: |
          set -o pipefail
          # Each @Suite in this file needs its own Swift Testing selector.
          snapshot_tests=()
          while IFS= read -r suite; do
            snapshot_tests+=("-only-testing:MeshtasticTests/$suite")
          done < <(
            python3 - <<'PY'
          import pathlib
          import re

          source = pathlib.Path("MeshtasticTests/SwiftUIViewSnapshotTests.swift").read_text()
          suites = re.findall(r"@Suite\([^\n]+\)\s*\n(?:@MainActor\s*\n)?struct\s+(\w+SnapshotTests)\b", source)
          print(*suites, sep="\n")
          PY
          )

          expected_snapshot_suite_count=38
          if (( ${#snapshot_tests[@]} != expected_snapshot_suite_count )); then
            echo "Expected $expected_snapshot_suite_count snapshot test suites, found ${#snapshot_tests[@]}" >&2
            exit 1
          fi

          xcodebuild test \
            -workspace Meshtastic.xcworkspace \
            -scheme Meshtastic \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            "${snapshot_tests[@]}" \
            2>&1 | tail -20

      - name: Verify snapshot tests leave references unchanged
        run: |
          changes="$(git status --porcelain -- MeshtasticTests/__Snapshots__ docs/assets/screenshots)"
          if [[ -n "$changes" ]]; then
            echo "Snapshot tests changed reference files:" >&2
            echo "$changes" >&2
            exit 1
          fi

      - name: Copy snapshots to docs
        run: bash scripts/copy-snapshots.sh --output Meshtastic/Resources/docs/assets/screenshots

      - name: Verify charCount freshness
        run: |
          if [[ ! -f Meshtastic/Resources/docs/index.json ]]; then
            echo "error: docs/index.json missing — run build-docs.sh first" >&2
            exit 1
          fi
          # Fail if any charCount is 0 (indicates a build-docs.sh was not run)
          python3 -c "
          import json, sys
          with open('Meshtastic/Resources/docs/index.json') as f:
              entries = json.load(f)
          stale = [e['id'] for e in entries if e.get('charCount', 0) == 0]
          if stale:
              print('error: stale charCount (0) for pages:', stale, file=sys.stderr)
              sys.exit(1)
          print(f'charCount check passed for {len(entries)} pages')
          "

      - name: Upload snapshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-snapshots
          path: Meshtastic/Resources/docs/assets/screenshots/

  build:
    runs-on: ubuntu-latest
    needs: build-snapshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download snapshots
        uses: actions/download-artifact@v4
        with:
          name: doc-snapshots
          path: Meshtastic/Resources/docs/assets/screenshots/

      - name: Copy snapshots for Jekyll
        run: |
          mkdir -p docs/assets/screenshots
          cp Meshtastic/Resources/docs/assets/screenshots/*.png docs/assets/screenshots/

      - name: Install cmark-gfm
        run: sudo apt-get install -y cmark-gfm

      - name: Build docs bundle
        run: bash scripts/build-docs.sh --output Meshtastic/Resources/docs

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      # Validation only — confirms the Jekyll site builds. Publishing happens on
      # tagged releases (docs-release.yml), not here, so main never overwrites the
      # released Pages site.
      - name: Build with Jekyll (validation only — not published)
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site --baseurl "/Meshtastic-Apple"
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: meshtastic/Meshtastic-Apple
