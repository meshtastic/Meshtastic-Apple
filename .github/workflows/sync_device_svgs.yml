name: Sync Device Images

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering

# main only takes changes through a pull request, so the run opens one.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync-device-svgs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Sync device images, 3D models and hardware catalog
      # Write to the bundled resource location the app loads at runtime
      # (the Bundle "images" subdirectory + DeviceHardware.json; see MeshtasticAPI).
      # --force ignores the cached API hash so the committed snapshot always matches
      # the upstream device hardware API.
      run: |
        python3 scripts/download_images.py \
          --output-dir "Meshtastic/Resources/images" \
          --output-json "Meshtastic/Resources/DeviceHardware.json" \
          --models-dir "Meshtastic/Resources/DeviceModels" \
          --force \
          --require-api \
          --verbose

    - name: Open or update the pull request
      id: pr
      # Opens a PR only when files are new, updated or removed. Later runs update the
      # same branch, and the PR is closed if main catches up.
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Sync device images and hardware list"
        title: "Sync device images and hardware list"
        body: |
          Device images, 3D models and the hardware list refreshed from
          https://api.meshtastic.org/resource/deviceHardware and the web flasher.

          Opened by workflow run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        branch: chore/sync-device-images
        delete-branch: true
        add-paths: |
          Meshtastic/Resources/images
          Meshtastic/Resources/DeviceModels
          Meshtastic/Resources/DeviceHardware.json

    - name: Summary
      env:
        OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        PR_URL: ${{ steps.pr.outputs.pull-request-url }}
      run: |
        case "$OPERATION" in
          created|updated) echo "Device images and hardware list changed: $PR_URL ($OPERATION)" ;;
          closed) echo "No differences from main; closed $PR_URL" ;;
          *) echo "No changes; resources are up to date" ;;
        esac
