# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config — see https://docs.coderabbit.ai/getting-started/yaml-configuration
# Modeled on meshtastic/Meshtastic-Android/.coderabbit.yaml so both repos review the same way.
language: en-US

reviews:
  # chill = fewer nitpicks. CI already gates SwiftLint and tests, and the
  # maintainers are experienced — we want CodeRabbit for substance, not lint noise.
  profile: chill
  high_level_summary: true
  poem: false
  # Don't burn reviews on WIP; review when the PR goes ready.
  auto_review:
    enabled: true
    drafts: false
    # Review once when the PR goes ready, then on demand via `@coderabbitai review`.
    # Re-reviewing every push turns multi-commit PRs into many review rounds, because
    # each fix commit reopens a full pass. Batch the fixes, push, then ask for one re-review.
    auto_incremental_review: false
    ignore_usernames:
      # Workflow-authored PRs (device SVG/hardware syncs, design-standards syncs,
      # docs bundles) — machine-generated content, nothing to review.
      - github-actions
      - github-actions[bot]
      - dependabot[bot]
  # Stop reviewing once a PR is closed.
  abort_on_close: true

  path_filters:
    # Generated / huge / non-source — don't review, just noise + token burn.
    - "!**/build/**"
    - "!**/*.png"
    - "!**/*.webp"
    - "!**/*.svg"
    # project.pbxproj is generated by xcodegen from project.yml; review project.yml instead.
    - "!**/*.pbxproj"
    # Asset catalogs — Contents.json plumbing, nothing reviewable.
    - "!**/*.xcassets/**"
    - "!**/*.icon/**"
    # Generated protobuf Swift sources (scripts/gen_protos.sh) and the upstream
    # protobufs submodule — owned upstream, never hand-edited here.
    - "!MeshtasticProtobufs/Sources/**"
    - "!**/*.pb.swift"
    - "!protobufs/**"
    # Machine-managed translations (scripts/translate-locale.sh). English source
    # strings arrive through the Swift diff; the catalog itself is churn.
    - "!**/*.xcstrings"
    - "!**/*.lproj/**"
    # Vendored device images and hardware metadata, synced from upstream by workflow.
    - "!Meshtastic/Resources/images/**"
    - "!Meshtastic/Resources/DeviceHardware.json"
    # Docs site and example data.
    - "!docs/**"
    - "!itak-example-data-package/**"
    # Spec Kit scaffolding and planning artifacts — tooling output, not app code.
    - "!.specify/**"
    - "!specs/**"

  path_instructions:
    # Global review contract. Everything below this entry is area-specific detail;
    # this is what "a finding" means in this repo at all.
    - path: "**"
      instructions: >-
        Report problems only. Every comment must name a concrete defect with evidence in the diff.
        No praise, no style preferences, no speculative design feedback, no "consider extracting this"
        on code that works.


        FLAG these categories:

        1. Bugs — logic errors, off-by-one, a force unwrap on a value that can be nil at runtime, a
        missing `await`, a thrown error silently discarded, dropped Task cancellation, incorrect
        teardown order.

        2. Security — credential or key exposure, injection, insecure defaults, PII/location/crypto-key
        material reaching a log sink or analytics payload (OSLog interpolation marked public, Datadog).

        3. Correctness — behaviour that contradicts the PR description, the linked issue, or an existing
        contract; a breaking change to a shared type with no justification.

        4. Behavioural contract changes — when a type is replaced, removed, or refactored, diff the OLD
        implementation against the NEW one. Look for a removed protocol conformance or `override`, a
        property that used to trap on invalid access and now returns a default, an error type that
        changed, and call sites that depended on the removed type's specific behaviour.

        5. Weakened invariants — validation quietly relaxed during a refactor. Swift shapes:
        `first!`/`try!` (traps loudly) swapped for `first`/`try?` plus a default so a broken state
        becomes a plausible value; a deleted `precondition`/`assert`/`guard`; an exhaustive `switch`
        gaining a `default:` branch that swallows new cases.

        6. Missing error handling at system boundaries — unvalidated input from the radio (FromRadio
        packets over BLE/TCP/serial), an MQTT broker, a `meshtastic:///` deep link, a scanned QR code,
        or an imported file. Do NOT flag nil checks the Swift type system already guarantees.

        7. Performance regressions — blocking work on the main actor, heavy work inside a SwiftUI
        `body`, N+1 SwiftData fetches in a loop, an unbounded fetch or `@Query` on a hot view, timers
        or polling where an event would do, allocation in a per-packet path.

        8. Concurrency — unguarded shared mutable state, `@unchecked Sendable` papering over a real
        race, a read-decide-write sequence spanning an `await`, main-actor deadlock
        (`DispatchQueue.main.sync` from the main thread), assumptions that two awaits run without
        interleaving.

        9. Temporal coupling and initialisation safety — an implicitly unwrapped optional paired with a
        separate `setup()`/`start()` that a caller must remember, singletons that only work when touched
        in one order, any pattern where a forgotten call is a runtime crash with no compile-time signal.

        10. Resource leaks — a `Task` or Combine subscription created and never cancelled or stored, a
        NotificationCenter/KVO observer with no matching removal, a timer never invalidated, a BLE or
        socket connection not closed on every exit path, a closure in a long-lived object capturing
        `self` strongly and forming a retain cycle. Flag these even when the pattern was moved in from
        elsewhere.

        11. Dead code and stale comments — a comment describing behaviour the code no longer has, an
        unused local or parameter, a materialising call whose result is never consumed.

        12. Repository convention violations — see CLAUDE.md and .github/copilot-instructions.md.
        Highest value: `print()` instead of the typed `Logger` categories, UIKit where SwiftUI works,
        persistence outside SwiftData, hardcoded user-facing strings instead of localized ones, image
        assets where an SF Symbol exists, hand-edits to generated files (project.pbxproj, protobuf
        sources, xcstrings translations).

        13. Comment problems — a comment that contradicts the code, a workaround with no tracking link, a
        parser or protocol handler that omits the raw wire shape needed to read the edge cases, and
        privacy- or security-sensitive behaviour whose comment fails to explain scope and WHY. Do not ask
        for comments on obvious code.


        Do NOT flag: style already enforced by SwiftLint (.swiftlint.yml deliberately relaxes line and
        file length — do not reintroduce those complaints); missing doc comments, unless a new shared
        API is entirely undocumented; refactoring suggestions for code the PR did not touch; generated
        output (protobuf .pb.swift files, project.pbxproj, xcstrings translations, DeviceHardware.json,
        vendored device images); missing tests for docs-only, comment-only, or mechanical-rename changes.


        Moved or extracted code counts as newly written. Review it on its merits and flag pre-existing
        defects that came along with it, labelled "pre-existing — good opportunity to fix during this
        refactor" so the author can weigh scope.


        One problem per comment. Cite the exact line, symbol, or condition. Give a fix direction — a
        snippet when the fix is not obvious. Never restate a finding already raised in an existing
        review thread.
    - path: "**/*.swift"
      instructions: >
        Flag leftover // ... existing code ... placeholders, `print()` instead of the typed Logger
        categories, and any logging of PII, location, or cryptographic keys.
    - path: "project.yml"
      instructions: >
        This file is the xcodegen source of truth; Meshtastic.xcodeproj/project.pbxproj is generated
        from it and hand-edits to the pbxproj get overwritten. Target, entitlement, and build-setting
        changes belong here.
    - path: "**/*.entitlements"
      instructions: >
        Entitlements are split per platform. The Mac Catalyst build must not carry the CarPlay
        communication entitlement (App Store rejection); flag any change that gives the Catalyst
        target CarPlay or otherwise merges platform-specific entitlements.
    - path: "Meshtastic/Accessory/"
      instructions: >-
        Transport boundary (BLE/TCP/serial). Review focus: every packet from the radio is untrusted
        input — validate before use; every connect path needs a matching teardown on all exit paths,
        including error and cancellation; no blocking work on the main actor.
    - path: "Meshtastic/Model/"
      instructions: >-
        SwiftData schema. Schema changes must go through VersionedSchema and the SchemaMigrationPlan
        in MeshtasticSchema.swift and stay additive; rows written by an older build must survive.
        Never replace the ModelContainer at runtime. Background writes go through the @ModelActor,
        not ad-hoc contexts.
    - path: "Widgets/"
      instructions: >
        Widget extension. No BLE or long-running work here; timeline providers must stay light.
        Types shared with the app (Live Activity attributes) live in Shared/.
    - path: "ci_scripts/"
      instructions: >
        Xcode Cloud build hooks. Flag a removed `set -e`-style guard, secrets echoed to the build log,
        and path assumptions that only hold on a developer machine.
    - path: ".github/workflows/"
      instructions: >-
        Review focus: unintended side effects. Flag a change that widens a trigger (especially
        `pull_request_target` and anything granting write scopes to fork-authored code), a secret exposed
        to an untrusted context, a cache key that lets one job poison another, and an unpinned third-party
        action. Job-level `continue-on-error` or a removed `--fail`-style guard silently converts a broken
        gate into a green tick — flag it.

  # Every CodeRabbit tool is enabled by default, so this block only ever needs to
  # turn things OFF or configure them. swiftlint is off because CI and the
  # pre-commit hook own it — duplicate lint comments are exactly the noise this
  # config exists to remove. The scanners CI doesn't run (gitleaks, shellcheck,
  # actionlint, semgrep, ...) are already on by default; don't re-list them.
  tools:
    swiftlint:
      enabled: false

  # Auto-generated docstrings/tests/autofix are noisy for a repo with
  # human-authored docs and platform-aware tests; leave finishing touches off.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # No doc-coverage mandate in this repo; the default warning-at-80% check
  # would nag every PR.
  pre_merge_checks:
    docstrings:
      mode: "off"
    # Defect classes that survive review-by-prose because they are about what is
    # ABSENT from a diff — a sibling call site left unfixed, a test that would still
    # pass with the fix reverted, a regression nobody covered, a behaviour quietly
    # dropped while code moved files. A per-file reviewer never sees these; a
    # whole-PR check does. Warning, not error: all four are judgment calls and a
    # false positive must not block a merge.
    custom_checks:
      - name: "Sibling call sites and presence semantics"
        mode: "warning"
        instructions: >-
          When a diff changes how an absent value is represented — making a field optional,
          removing a zero-guard, or adding a presence check — verify EVERY call site of that
          field was updated, not just the one the bug was reported against. This repo has
          sibling views that render the same data (phone vs watch, full vs compact rows);
          name any unfixed sibling explicitly. Also flag a new field defaulting to 0 where 0
          is a physically reachable value on that scale (RSSI, temperature, current, voltage,
          particulate concentration). Exception, do NOT flag: the proto `rx_snr`, which has no
          presence upstream, so its 0 ambiguity cannot be fixed app-side. An app-level SNR
          field that IS optional is still in scope.
      - name: "Tests prove the path, not the end state"
        mode: "warning"
        instructions: >-
          For each added or changed test, decide whether it would still pass if the production
          code it covers were reverted. Flag tests that seed a mock's backing store and then
          assert the value comes back, tests that assert only a collection's count rather than
          which items survived, and tests that rely on `Task.sleep` or timing for ordering
          instead of awaiting the actual signal. A test must assert the side effect only the
          intended path produces — a call counter, a packet sent, a row written.
      - name: "Regression coverage for changed behavior"
        mode: "warning"
        instructions: >-
          Do not stop at "tests pass" or "there are tests". For each non-trivial production change in
          the diff, work through four steps and report only the gaps.


          1. Changed behaviour — name the concrete code path, function, or configuration key from the
          diff whose behaviour changed.

          2. Observable surfaces — which of these can see the change: the mesh/radio protocol
          handling, persisted SwiftData rows, UserDefaults/@AppStorage, SwiftUI view state,
          navigation and meshtastic:/// deep links, notifications, BLE/serial/TCP transport, MQTT,
          widgets and Live Activities, CarPlay, or the watchOS, tvOS, and Mac Catalyst targets.

          3. Regression risks — the specific ways this could break a working scenario: ordering and
          timing changes, reconnect and retry paths, app relaunch and state restore, schema
          compatibility for rows written by an older build, cross-target call sites, and platform
          differences (iOS vs Catalyst vs watchOS vs tvOS).

          4. Coverage gap — name the test that should exist and does not.


          A bug fix needs a test that FAILS without the fix. A test that only exercises the happy
          path, or a regenerated snapshot, does not prove a behaviour change.


          State each finding as: impacted code path, the regression risk, the missing test shape. Be
          specific enough that the author can write the test from the comment.


          Do NOT ask for tests for: documentation-only or comment-only changes, mechanical renames,
          dependency version bumps, or refactors the diff shows to be behaviour-preserving. Do not
          demand a test category for a surface the change cannot reach — a pure formatting helper in
          Shared/ does not need a transport test.
      - name: "Moved code diffed against its original"
        mode: "warning"
        instructions: >-
          Applies when the diff deletes a type/function in one file and adds something similar
          elsewhere, or extracts code into a new file or target. Treat the moved code as newly written
          and compare the OLD implementation against the NEW one line by line.


          Flag any of the following that the move introduced silently:

          - a removed `override`, or a protocol requirement the new type no longer implements;

          - a changed error contract — something that threw or trapped now returns a default, or vice
          versa;

          - a dropped `precondition`/`assert`/`guard` validation, or an access level that widened;

          - a default parameter value that changed, which alters every call site that omitted it;

          - an optionality change on a numeric field, which is the presence-vs-sentinel-zero class;

          - a lost `Codable`/`Sendable` conformance, property wrapper (`@Published`, `@AppStorage`),
          or `@MainActor`/actor isolation that alters instance lifetime or thread affinity;

          - a Task priority, dispatch queue, or actor context that changed during the move.


          Then check the call sites of the removed declaration: every caller that relied on the old
          behaviour must still be correct. Name any caller the PR left on the old assumption.


          Pre-existing defects carried into the new location are in scope — label them "pre-existing —
          good opportunity to fix during this refactor" so the author can decide on scope. Do not flag
          a move that the diff shows to be genuinely mechanical.

knowledge_base:
  # Learnings are how a confirmed finding stops recurring on the next PR. Pin the
  # scope to this repo: the default `auto` already resolves to `local` for public
  # repos, but being explicit keeps it from shifting if visibility ever changes.
  learnings:
    scope: local
  # Feed CodeRabbit the same guidance human/AI contributors follow, including the
  # repo-specific .skills/ modules it wouldn't pick up by default.
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".skills/**/SKILL.md"
