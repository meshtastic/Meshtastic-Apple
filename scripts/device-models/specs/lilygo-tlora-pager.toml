source = "https://lilygo.cc/products/t-lora-pager"
confidence = "estimated"
edge_radius_mm = 4.0
front_edge_radius_mm = 2.0
appendage = "none"

[[antenna]]
name = "AntennaRight"
start = [502.75, 268.8]
end = [502.75, 1.0]

[[antenna]]
name = "AntennaLeft"
start = [52.8, 251.2]
end = [52.8, 5.3]
