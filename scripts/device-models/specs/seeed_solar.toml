# seeed_solar: SenseCAP Solar Node P1. The flasher's illustration is a true front view of the
# panel and frame, so it stays the drawing. Behind it, the frame is a thin tray and the depth
# comes from the electronics box on the back, built here by measurement from Seeed's photos:
# https://www.seeedstudio.com/SenseCAP-Solar-Node-P1-for-Meshtastic-LoRa-p-6425.html
# (gallery images 4, 8 and 9: the straight-on back, the button side and the antenna connector).
# The back photo is calibrated against the published 191.2 x 201.2 mm outline (3.5 px/mm both
# ways); everything on the back is estimated from it. Model frame: x from the center line as seen
# from the front, y up from the bottom, z out of the panel with 0 the middle of the frame.

[size]
width_mm = 191.2
height_mm = 201.2
# The frame and panel; the box adds 28.1 mm behind, for the wiki's 42.1 mm overall.
depth_mm = 14.0
scale_by = "width"
fit_bbox = [199, 228, 574, 636]  # case only, antenna excluded
appendage = "none"
edge_radius_mm = 6          # the back edge slopes in like a tray
front_edge_radius_mm = 1.5  # small: the frame and clip tabs sit at the front edge
body_color = "#d9ddd6"      # light gray case; the dark panel stays on the face
covers = "frame and panel 14 mm (estimated) plus the electronics box behind, 42.1 mm overall; the antenna is built at its connector"
source = "https://wiki.seeedstudio.com/meshtastic_solar_node/"
confidence = "vendor"

[materials]
# The solar panel: near-black with a little shine, instead of plain plastic.
c_232527 = { color = "#1b1f26", roughness = 0.25 }
case     = { color = "#d9ddd6", roughness = 0.55 }
brass    = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
screw    = { color = "#26282a", roughness = 0.5 }
rubber   = { color = "#1f2022", roughness = 0.8 }
port     = { color = "#1d1d1f", roughness = 0.6 }

# The drawing's antenna stands on top of the frame; the real one screws onto the connector on the
# side of the box, so the drawn one is left out and a round one is built there instead.
[[part]]
name = "DrawnAntenna"
class = "cls-1"
max_width_mm = 15
role = "skip"

# The electronics box, 119.5 x 157.7 mm, centered 102.3 mm up and slightly right of center as
# seen from the front, standing 28.1 mm off the back of the frame.
[[solid]]
name = "Box"
material = "case"
center_mm = [4.2, 102.3, -20.6]
size_mm = [119.5, 157.7, 29.0]
radius_mm = 6.0
confidence = "estimated from photos"

