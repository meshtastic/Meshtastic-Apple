# rak11200: the RAK19007 base with the RAK11200 core in the CPU slot (its ESP32-WROVER antenna end
# overhangs the left edge) and a RAK13300 LoRa module in the IO slot, overhanging the far end.
# The drawing is our copy of the flasher's top view with the RAK13300 redrawn at its published
# 25 x 35 mm: the flasher draws it about 6.5% too large and flush with the base's left edge.
# Its place comes from lining its connector (RAK13300 drawing: 2.2 mm in from its edge, 5.5 mm
# from its end) up with the base's IO slot connector: 0.5 mm in from the base edge, 45.1 to
# 80.1 mm from the USB-C end.
# Sources:
# RAK19007 drawing (30 x 60, 1.00 mm PCB, cutouts, and the side view for part heights):
# https://images.docs.rakwireless.com/wisblock/rak19007/datasheet/image-20220218090849344.png
# RAK11200 drawing (20 x 30 core PCB 1.00 mm, 18 mm WROVER overhanging to 36.40, 4.30 mm thick;
# its side view at 25.6 px/mm gives the WROVER PCB 0.8 mm and the shield 2.5 mm):
# https://images.docs.rakwireless.com/wisblock/rak11200/datasheet/image-20210310153730185.png
# RAK13300 drawing (25 x 35, 1.00 mm PCB, connector position):
# https://images.docs.rakwireless.com/wisblock/rak13300/datasheet/mechanical-drawing.png
# The core and the RAK13300 sit 1.8 mm above the base on their connectors, as the RAK4631 core CAD
# shows for the same connector (see rak4631.toml); RAK doesn't publish it for these two.
# Model frame: x from the center line, y up from the bottom (the RAK13300's far end), z out of the
# top face with 0 the middle of the base PCB (top face at +0.5, bottom at -0.5). In base-board mm
# from the USB-C end: x = X - 11.61, y = 80.10 - Y.
drawing = "drawings/rak11200.svg"

[size]
width_mm = 36.8
height_mm = 80.6
# Base PCB plus the WROVER shield, the tallest part (6.1 mm above the base).
depth_mm = 7.1
board_mm = 1.0
scale_by = "width"
covers = "RAK19007 base (30x60) with the RAK11200 core overhanging the left edge and the RAK13300 (25x35) overhanging the far end; PCBs only, no external antenna"
source = "https://docs.rakwireless.com/product-categories/wisblock/rak11200/datasheet/"
confidence = "vendor"

[materials]
connector = { color = "#202121", roughness = 0.6 }
gold      = { color = "#e0ad53", roughness = 0.3, metallic = 1.0 }
hole      = { color = "#ededed", roughness = 0.5 }

