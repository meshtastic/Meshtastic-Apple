# heltec-wireless-tracker: Heltec Wireless Tracker V1.1, the bare board seen from the display side.
# Size from the datasheet's mechanical drawing (read from a scanned image): https://resource.heltec.cn/download/Wireless_Tracker/Wireless%20Tracker1.1.pdf
# The PCB thickness isn't published; 1.0 mm is an estimate. The display stands 3.0 mm off the board, an estimate for
# a small OLED or TFT module on its spacer: the published 14.4 mm takes in parts on the back and connectors; the other parts are built flat on the board.
# 65.84 includes the USB-C overhang (the PCB alone is 63.64). The spec table's 65.48 x 13.52 looks transposed;
# the drawing is used. Its 14.40 depth includes the fitted headers.
