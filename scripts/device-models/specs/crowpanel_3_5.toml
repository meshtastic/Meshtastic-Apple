# crowpanel_3_5: Elecrow CrowPanel Advance 3.5 in its case. The flasher's illustration is the bare
# board (no case), so this model is built from our own front drawing (drawings/) and parts placed
# in mm. Every figure is measured from Elecrow's current STEP, used for measurement only:
# https://github.com/Elecrow-RD/CrowPanel-Advance-3.5-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-480x320/tree/master/3D%20file
# advance-hmi3_5-20260126.stp (v1.3, sha256 db8f3f2ced6a156877c4c8424ed1e902a782f4a9c66a67ab144a44514c4bb0d1).
# It is 98.8 x 63.4 mm; the store page says 101.4 x 63.3 x 15.8, likely the older case (as with the
# 2.4, whose older STEP matches its store figures). The case is a front shell and a back shell with
# the board showing between them, screws at the corners front and back, a lidded module bay and a
# cutout at the BOOT/RESET corner, as in Elecrow's back photo:
# https://www.elecrow.com/media/catalog/product/b/a/backside_of_esp32_advance_3.5inch_hmi_touchscreen_with_acrylic_case1.jpg
# The "3.5"" on the flasher's drawing is screen content, not printed on the device, so it's left out.
# Model frame: x from the center line, y up from the bottom, z out of the display with 0 the
# middle of the case; the CAD's 48.4 - x, y + 2.35 and 0.7 - z give these.
drawing = "drawings/crowpanel_3_5.svg"

[size]
width_mm = 98.8
height_mm = 63.4
# Case front to the back plate. The display glass stands 0.5 mm proud and the screw heads 1.0 mm
# on each side: 16.6 mm over the screws.
depth_mm = 14.6
scale_by = "width"
covers = "case; screw heads add 1 mm front and back"
source = "https://raw.githubusercontent.com/Elecrow-RD/CrowPanel-Advance-3.5-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-480x320/master/3D%20file/advance-hmi3_5-20260126.stp"
confidence = "cad"
edge_radius_mm = 0.3
front_edge_radius_mm = 0.5

[materials]
c_1d1d1f = { color = "#1d1d1f", roughness = 0.6 }
acrylic  = { color = "#0b0b0c", roughness = 0.12 }
opening  = { color = "#060606", roughness = 0.9 }
seam     = { color = "#0e0e0f", roughness = 0.8 }
screw    = { color = "#2a2a2c", roughness = 0.45, metallic = 0.8 }
jst      = { color = "#ece6d6", roughness = 0.5 }
jst_in   = { color = "#c9c0ac", roughness = 0.6 }
metal    = { color = "#a9abae", roughness = 0.35, metallic = 1.0 }

# The display module stands 0.5 mm off the case; the flex slot and the hole are openings, so
# they're painted flush. The active area's place in the glass is estimated from Elecrow's photo
# of the bare board (esp32_advance_hmi_3.5inch_display.jpg), sized to the 3.5" panel's 73.44 x 48.96.
[[part]]
name = "Glass"
class = "glass"
z = 0
h = 0.5

[[part]]
name = "Display"
class = "display"
z = 0
h = 0.52

[[part]]
name = "FlexSlot"
class = "flex"
z = -0.29
h = 0.3

[[part]]
name = "Hole"
class = "hole"
z = -0.29
h = 0.3

