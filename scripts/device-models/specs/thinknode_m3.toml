# square (as a 49 mm square it would be too dense for 40 g with a 770 mAh
# battery), so fit_bbox is a 502-unit square (side + corner radius from the
# path) centered on the drawing, and the corner-to-corner extent is ~84 mm.
# Internal antennas only. The case is a soft rounded slab, rounder on the back.

[size]
