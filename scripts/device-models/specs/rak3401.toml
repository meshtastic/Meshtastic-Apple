# rak3401: the WisMesh 1W Booster: RAK19007 base board, RAK3401 core (the black 20 x 30 mm carrier
# holding the green RAK3400 module) and the RAK13302 1 W LoRa module in the IO slot, overhanging
# the end of the base. The flasher's illustration is a true top view, so it stays the drawing.
# Board outlines and heights from RAK's mechanical drawings:
# RAK19007 (60 x 30, PCB 1.00, top/side/bottom views):
#   https://images.docs.rakwireless.com/wisblock/rak19007/datasheet/image-20220218090849344.png
# RAK13302 (35 x 25, PCB 1.00): https://images.docs.rakwireless.com/wisblock/rak13302/datasheet/rak13302-dimensions.png
# RAK3401 (20 x 30): https://docs.rakwireless.com/product-categories/wisblock/rak3401/datasheet/
# In the drawing, 211.32 units = 30.0 mm (7.044 units/mm): the base runs y 13.07-435.15 (59.9 mm)
# and the RAK13302 x 0.5-175.87 (24.9 mm) out to y 579.15, 20.4 mm past the end of the base.

[size]
width_mm = 30.0
height_mm = 82.2
# Overall: base PCB 1.0 + the battery connector, 6.0 mm, the tallest part on top.
depth_mm = 7.0
board_mm = 1.0
scale_by = "width"
covers = "RAK19007 + RAK3401 + RAK13302 stack, the USB-C's overhang included; excludes antennas"
source = "https://images.docs.rakwireless.com/wisblock/rak19007/datasheet/image-20220218090849344.png"
confidence = "vendor"

[materials]
shield = { color = "#c4c6c8", roughness = 0.35, metallic = 1.0 }

# Heights above the base board, read off the RAK19007 side view (about 10.2 px/mm): USB-C 3.3,
# battery JST 6.0, solar JST 4.6, reset switch 1.8.
[[block]]
name = "USBC"
bbox = [96, 0, 160, 58]
h = 3.3

[[block]]
name = "Battery"
bbox = [164, 59, 208, 93]
h = 6.0

[[block]]
name = "Solar"
bbox = [3, 60, 36, 91]
h = 4.6

[[block]]
name = "Reset"
bbox = [54, 17, 91, 40]
h = 1.8

# RAK3401: its black 20 mm board spans the full width between the silkscreen line at y 95.8 and
# the edge at y 238.6 (20.3 mm). It sits on the WisBlock connector; the 1.5 mm gap is estimated.
# The RAK3400 module on it (23.5 x 15.3 mm in the drawing) is estimated at 2.0 mm, which brings
# the core to the 4.5 mm RAK lists for its WisBlock cores (RAK3312 store page).
[[block]]
name = "CoreBoard"
bbox = [0.5, 95.8, 211.82, 238.6]
base_mm = 1.5
h = 2.5
side_color = "#202121"

[[block]]
name = "CoreModule"
bbox = [22.7, 111.2, 187.9, 218.7]
base_mm = 2.5
h = 4.5
side_color = "#216749"

# RAK13302 on the IO connector: 1.5 mm gap (estimated) + 1.0 mm PCB (drawing). Past y 435.15
# there is no base board under it. The drawing's shield starts at y 327.9, 0.7 mm before the
# 35 mm board would; the board follows the shield.
[[block]]
name = "LoRaBoard"
bbox = [0.5, 327.9, 175.87, 435.15]
base_mm = 1.5
h = 2.5
side_color = "#202121"

[[block]]
name = "LoRaBoardOverhang"
bbox = [0.5, 435.15, 175.87, 579.15]
base_mm = 1.5
h = 2.5
hollow_under = true
side_color = "#202121"

# Shield can, about 2.5 mm over the RAK13302 PCB, and the power inductor, about 3 mm; both are
# estimated from RAK's store photos (scaled by the 5.0 mm mounting pads).
# https://cdn.shopify.com/s/files/1/0177/8784/6756/files/RAK13302_WisBlock_LPWAN-Module_VD-Dimension_1.png
[[block]]
name = "LoRaShield"
bbox = [27.8, 327.9, 134.4, 435.15]
base_mm = 2.5
h = 5.0
material = "shield"
confidence = "estimated from photos"

[[block]]
name = "LoRaShieldOverhang"
bbox = [27.8, 435.15, 134.4, 556.5]
base_mm = 2.5
h = 5.0
hollow_under = true
material = "shield"
confidence = "estimated from photos"

[[block]]
name = "Inductor"
bbox = [139.9, 442.9, 165.5, 470.5]
base_mm = 2.5
h = 5.5
hollow_under = true
side_color = "#2a2b2c"
confidence = "estimated from photos"
