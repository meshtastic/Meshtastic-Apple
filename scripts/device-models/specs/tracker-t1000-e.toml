# tracker-t1000-e: SenseCAP Card Tracker T1000-E. The flasher's illustration is a front view but
# also draws circuit board marks seen through the case, so this uses our copy of it with those
# taken out (drawings/). Its button, light window and buzzer match Seeed's straight-on front photo
# to within 0.3 mm. The back is built from Seeed's straight-on back photo, calibrated against the
# published 55 x 85 mm (8.13 px/mm both ways):
# https://media-cdn.seeedstudio.com/media/catalog/product/5/-/5-114993369-sensecap-card-tracker-t1000-e-for-meshtastic-back.jpg
# Model frame: x from the center line as seen from the front, y up from the bottom, z out of the
# front with 0 the middle of the body.
# Not built: the lanyard slot is shown dark on both faces rather than cut through (the generator
# fills holes in the outline), and the printed SENSECAP logo and back label are left out.
drawing = "drawings/tracker-t1000-e.svg"

[size]
# Seeed wiki and T1000 datasheet: 85 x 55 x 6.5 mm, 32 g. The drawing is 54.8 x 85.4 mm at this scale.
width_mm = 55.0
height_mm = 85.0
depth_mm = 6.5
scale_by = "width"
covers = "whole device (internal antennas)"
source = "https://wiki.seeedstudio.com/t1000_e_intro/"
confidence = "vendor"
# Translucent dark gray case with well rounded sides (Seeed's 45-degree photos).
edge_radius_mm = 3.0
front_edge_radius_mm = 2.0

[materials]
slot   = { color = "#141414", roughness = 0.8 }
strip  = { color = "#1a1a1a", roughness = 0.6 }
magnet = { color = "#bdbdbb", roughness = 0.3, metallic = 1.0 }
pin    = { color = "#d4a650", roughness = 0.3, metallic = 1.0 }

# The lanyard slot as seen from the back, where the drawing puts it: 16.1 x 3.0 mm, 3.8 mm below
# the top. It reaches into the body so it stays whole over the rounded back edge.
[[solid]]
name = "SlotBack"
material = "slot"
center_mm = [0, 81.2, -2.9]
size_mm = [16.1, 3.0, 0.9]
radius_mm = 1.5

# Back: the magnetic charging connector, a dark strip with a magnet at each end and four
# pogo pads between them, off center toward the right edge as seen from the front.
[[solid]]
name = "ChargeStrip"
material = "strip"
center_mm = [12.9, 48.7, -3.35]
size_mm = [5.2, 19.0, 0.3]
radius_mm = 2.6
confidence = "estimated from photos"

[[solid]]
name = "MagnetUpper"
material = "magnet"
center_mm = [12.9, 56.0, -3.45]
size_mm = [3.7, 3.7, 0.3]
radius_mm = 1.85
confidence = "estimated from photos"

[[solid]]
name = "MagnetLower"
material = "magnet"
center_mm = [12.9, 41.5, -3.45]
size_mm = [3.7, 3.7, 0.3]
radius_mm = 1.85
confidence = "estimated from photos"

[[solid]]
