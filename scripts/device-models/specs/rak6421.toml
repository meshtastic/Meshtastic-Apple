# rak6421: the RAK6421 WisMesh Pi HAT with a WisBlock IO module in IO slot 2, seen from above with
# the Pi header along the right edge. The flasher's illustration is drawn about 2.5% narrow (9.03
# units/mm across, 9.26 down), so this uses our copy of it stretched to scale (drawings/).
# RAK's mechanical drawing gives the outline, holes and heights:
# https://images.docs.rakwireless.com/wishat/rak6421/datasheet/rak6421-mechanical.png
# 65 x 56 mm, holes 58 x 49 mm, PCB 1.60, the Pi socket 8.50 below; its side view (23.8 px/mm)
# gives the header pin ends 1.4 mm and the WisBlock connectors and standoffs 0.9 mm above the board.
# That drawing has no J9 header, ADC parts or underside parts, so it is likely an earlier revision
# than the VC in the flasher's illustration; the J9 header and the inductor underneath come from
# RAK's photos of the current VD board (store: https://store.rakwireless.com/products/meshtastic-raspberry-pi-hat-rak6421).
# Those photos also show the Pi header pins standing well above the board, longer than the
# drawing's 1.4 mm; the model follows the drawing.
# Model frame: x from the center line, y up from the bottom edge of the illustration, z out of the
# top with 0 the middle of the board.
drawing = "drawings/rak6421.svg"

[size]
width_mm = 56.0
height_mm = 65.0
# Overall: 8.5 mm socket below + 1.6 mm PCB + the J9 header, about 8.5 mm, on top.
depth_mm = 18.6
board_mm = 1.6
scale_by = "width"
covers = "HAT PCB with the drawn IO module, the Pi socket below and the J9 header on top"
source = "https://images.docs.rakwireless.com/wishat/rak6421/datasheet/rak6421-mechanical.png"
confidence = "vendor"

[materials]
gold   = { color = "#d4b062", roughness = 0.3, metallic = 1.0 }
socket = { color = "#1c1c1c", roughness = 0.6 }
can    = { color = "#c4c6c8", roughness = 0.35, metallic = 1.0 }
dark   = { color = "#2a2a2a", roughness = 0.5 }

# WisBlock connectors: four sensor slots along the header and IO slot 1, 0.9 mm (side view).
[[block]]
name = "SlotJ4"
bbox = [357.9, 16.5, 429.8, 50.5]
h = 0.9

[[block]]
name = "SlotJ5"
bbox = [357.9, 256.8, 429.8, 290.8]
h = 0.9

[[block]]
name = "SlotJ6"
bbox = [357.9, 365.9, 429.8, 399.9]
h = 0.9

[[block]]
name = "SlotJ7"
bbox = [357.9, 487.4, 429.8, 521.5]
h = 0.9

[[block]]
name = "IOSlotJ1"
bbox = [231.8, 259.6, 335.7, 293.8]
h = 0.9

# The two round standoffs by the mounting holes, 0.9 mm (side view).
[[block]]
name = "StandoffUpper"
bbox = [28.9, 57.6, 82.7, 110.1]
h = 0.9
radius_mm = 2.8

[[block]]
name = "StandoffLower"
bbox = [28.9, 492.4, 82.5, 544.9]
h = 0.9
radius_mm = 2.8

# The IO module: 1.0 mm board on its connector (1.5 mm gap, estimated) and its shield can, about
# 2 mm more (estimated). The drawn module is 37.5 x 25.3 mm, larger than RAK's 35 x 25 mm
# WisBlock IO size; it is kept as drawn. Under it the HAT has the IO slot 2 opening, which the
# illustration covers: from the mechanical drawing, open at x 0-9.5 mm (from the left edge as
# drawn) for y 32.7-53.0, x 9.5-21 for y to 57.9 and x 21-29 for y 39.5-53.9 (from the top).
# The module board is split so that its parts over the opening have no board under them.
[[block]]
name = "IOModuleOverOpening1"
bbox = [2.2, 303.0, 88.4, 491.1]
base_mm = 1.5
h = 2.5
hollow_under = true
side_color = "#262525"

[[block]]
name = "IOModuleOverOpening2"
bbox = [88.4, 303.0, 194.9, 536.9]
base_mm = 1.5
h = 2.5
hollow_under = true
side_color = "#262525"

[[block]]
name = "IOModuleOverOpening3"
bbox = [194.9, 366.1, 268.9, 499.4]
base_mm = 1.5
h = 2.5
hollow_under = true
side_color = "#262525"

[[block]]
name = "IOModuleRight"
bbox = [268.9, 303.0, 347.2, 536.9]
base_mm = 1.5
h = 2.5
side_color = "#262525"

[[block]]
name = "IOModuleTongueUpper"
bbox = [194.9, 303.0, 268.9, 366.1]
base_mm = 1.5
h = 2.5
side_color = "#262525"

[[block]]
name = "IOModuleTongueLower"
bbox = [194.9, 499.4, 268.9, 536.9]
base_mm = 1.5
h = 2.5
side_color = "#262525"

[[block]]
