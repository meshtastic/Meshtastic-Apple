# crowpanel_2_8: Elecrow CrowPanel Advance 2.8 in its case. The flasher's illustration is the bare
# board (no case), so this model is built from our own front drawing (drawings/) and parts placed
# in mm. Every figure is measured from Elecrow's current STEP, used for measurement only:
# https://github.com/Elecrow-RD/CrowPanel-Advance-2.8-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-320x240/tree/master/3D%20file
# advance-hmi2_8-20260126.stp (v1.2, sha256 4cf5a8bbc244ec28cfb68e1eadfa64f7bd269d1afd070eda3403dd02548fab34).
# It is 83 x 58.5 mm; the store page says 85.4 x 58.5 x 15.5, likely the older case (as with the
# 2.4, whose older STEP matches its store figures). The case is a front shell and a back shell with
# the board showing between them, screws at the corners front and back, a lidded module bay and a
# cutout at the BOOT/RESET corner, as in Elecrow's back photo:
# https://www.elecrow.com/media/catalog/product/b/a/backside_of_esp32_advance_2.8inch_hmi_touchscreen_with_case111.jpg
# The "2.8"" on the flasher's drawing is screen content, not printed on the device, so it's left out.
# Model frame: x from the center line, y up from the bottom, z out of the display with 0 the
# middle of the case; the CAD's 2739.85 - x, y - 1440.85 and 0.65 - z give these.
drawing = "drawings/crowpanel_2_8.svg"

[size]
width_mm = 83.0
height_mm = 58.5
# Case front to the back plate. The display glass stands 1.2 mm proud and the screw heads 1.0 mm
# on each side: 16.9 mm overall.
depth_mm = 14.7
scale_by = "width"
covers = "case; the display adds 1.2 mm in front, screw heads 1 mm behind"
source = "https://raw.githubusercontent.com/Elecrow-RD/CrowPanel-Advance-2.8-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-320x240/master/3D%20file/advance-hmi2_8-20260126.stp"
confidence = "cad"
edge_radius_mm = 0.3
front_edge_radius_mm = 0.5

[materials]
c_1d1d1f = { color = "#1d1d1f", roughness = 0.6 }
acrylic  = { color = "#0b0b0c", roughness = 0.12 }
opening  = { color = "#060606", roughness = 0.9 }
seam     = { color = "#0e0e0f", roughness = 0.8 }
screw    = { color = "#2a2a2c", roughness = 0.45, metallic = 0.8 }
jst      = { color = "#ece6d6", roughness = 0.5 }
jst_in   = { color = "#c9c0ac", roughness = 0.6 }
metal    = { color = "#a9abae", roughness = 0.35, metallic = 1.0 }

# The display module stands 1.2 mm off the case; the flex slot and the hole are openings, so
# they're painted flush. The active area's place in the glass is estimated from Elecrow's photo
# of the bare board (esp32_advance_hmi_2.8inch_display.jpg), sized to the 2.8" panel's 57.6 x 43.2.
[[part]]
name = "Glass"
class = "glass"
z = 0
h = 1.2

[[part]]
name = "Display"
class = "display"
z = 0
h = 1.22

[[part]]
name = "FlexSlot"
class = "flex"
z = -0.29
h = 0.3

[[part]]
name = "Hole"
class = "hole"
z = -0.29
h = 0.3

