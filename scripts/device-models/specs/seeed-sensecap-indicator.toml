# seeed-sensecap-indicator: generated layout from the SVG; add [[part]] rules to refine.
# TinyTronics: 96 L x 92 W x 19 H mm, 118 g. Another listing (via cnx-software/RobotShop search) gives 97 x 93 x 18 mm. Seeed wiki/manual give no dimensions. Drawing is a 3/4 perspective view with the stand, so drawn aspect 0.98 is not a clean front view.

[size]
width_mm = 92.0
height_mm = 96.0
depth_mm = 19.0
scale_by = "width"
covers = "whole device, kickstand folded"
source = "https://www.tinytronics.nl/en/development-boards/microcontroller-boards/with-lora/seeed-studio-sensecap-indicator-d1l"
confidence = "retailer"
# White plastic case for the sides and back; the dark screen stays on the face.
body_color = "#e5e5e3"
# Rounded white plastic case with a flat glass front inside a bezel.
edge_radius_mm = 5.0
front_edge_radius_mm = 1.0

# The drawing shows the left side wall (speaker grille) and the fold-out stand
# in perspective. Build that strip as a thin plate at the back instead of full
# depth. It follows the face's slanted left edge down to the stand, and stops
# at the stand's bottom (y 1222) so the bezel corner stays full depth.
[[thin]]
polygon = [[700, 560], [768, 560], [771, 650], [837, 962], [842, 1225], [700, 1225]]
depth_mm = 3
z_mm = -8

# The screen (drawn #353535) renders mid-gray as plain plastic. Make it darker,
# glossy glass so it reads as a screen against the white case.
[materials]
c_353535 = { color = "#101012", roughness = 0.15 }
