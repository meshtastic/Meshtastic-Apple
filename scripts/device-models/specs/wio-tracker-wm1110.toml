# board on the grid photo (centers 362.8 px apart on a 422 px board) and on the straight-on back
# photo (gallery image 3), which agree to 0.1 mm. The generator can't cut holes, so each is a
# dark disc in a plated ring, showing on both faces.
[[solid]]
name = "HoleRing1"
material = "plating"
center_mm = [-20.3, 2.8, 0]
size_mm = [4.6, 4.6, 1.3]
radius_mm = 2.3
confidence = "estimated from photos"

[[solid]]
