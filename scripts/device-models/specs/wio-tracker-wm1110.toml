# wio-tracker-wm1110: generated layout from the SVG; add [[part]] rules to refine.
# Seeed publishes no board dimensions (cnx-software lists 'Dimensions - Not specified'). Estimated from the drawing using the USB-C and Grove connectors as scale; height set from drawn aspect 0.67. Depth = PCB + Grove connectors, estimated.
# Board and part heights: WM1110 module 2.3 mm is published (20 x 20 x 2.3 mm, Wio-WM1110 module datasheet V1.3); PCB 1.2 mm and the connector and button heights are typical values.
# The two white parts near the top edge (AntennaLoRa, AntennaGNSS) are unidentified; their 1.2 mm height is a guess.
# Scale check: at 55 mm wide the drawn module is about 22 mm, not 20, so the board may be closer to 49 x 73 mm.

