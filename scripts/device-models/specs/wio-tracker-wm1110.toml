# wio-tracker-wm1110: Wio Tracker 1110 Dev Board, a bare board. The flasher's illustration is a
# true front view, but its board outline has a notch at the USB-C that the real board doesn't have,
# so this uses our copy of it with the notch taken out (drawings/).
# Seeed publishes no board dimensions. Size from Seeed's top-down photo on a cm grid (gallery image 5):
# https://media-cdn.seeedstudio.com/media/catalog/product/5/-/5-114993136-wio-tracker-1110-dev-board-size_1.jpg
# The board is 621 x 424 px there. Its two rulers disagree by 2% (90.7 px/cm along, 88.8 px/cm
# across) although the pixels are square (the WM1110 shield reads 172 x 172 px), so the size is the
# mean of the two: 69.2 x 47.2 mm (68.5 x 46.8 by one ruler, 69.9 x 47.7 by the other). The shield
# then reads 19.2 mm, against the module's published 20 x 20 mm. The drawing is 1.7% squatter than
# that, so our copy is stretched in height to match.
# The official 3D files are truncated on Seeed's server (wio tracker 723.stp stops at exactly 5 MiB),
# so there is no CAD to measure.
# Heights: the WM1110 module's 2.3 mm is published (Wio-WM1110 datasheet V1.3); the PCB, Grove,
# battery connector, antenna and button heights are estimated from the 45-degree gallery photos.
# Model frame: x from the center line with the USB-C at the bottom, y up from the board's bottom
# edge, z out of the front with 0 the middle of the PCB (front face +0.6, back -0.6).
drawing = "drawings/wio-tracker-wm1110.svg"

[size]
width_mm = 47.2
height_mm = 69.2
depth_mm = 7.2
board_mm = 1.2
scale_by = "width"
# The board's outline; the USB-C overhangs the bottom edge by about 1.6 mm.
fit_bbox = [653.25, 519.32, 1264.0, 1414.75]
appendage = "none"
covers = "bare PCB; depth is the PCB plus the Grove connectors"
source = "https://www.seeedstudio.com/Wio-Tracker-1110-Dev-Board-p-5799.html"
confidence = "estimated from photos"

[materials]
plating = { color = "#c9c9c4", roughness = 0.3, metallic = 1.0 }
hole    = { color = "#1a1a1a", roughness = 0.9 }
label   = { color = "#f4f4f2", roughness = 0.7 }
gold    = { color = "#d4b05a", roughness = 0.3, metallic = 1.0 }

[[block]]
name = "WM1110"
bbox = [830, 840.7, 1079, 1098.9]
h = 2.3

# Top-mounted, overhanging the bottom edge.
[[block]]
name = "USBC"
bbox = [935, 1339.8, 1044, 1436.4]
h = 3.2

# JST battery connector.
[[block]]
name = "Battery"
bbox = [794, 1325.5, 901, 1415.0]
h = 6.0

# Right-angle Grove connectors, three down each long side.
[[block]]
name = "GroveL1"
bbox = [662, 799.0, 764, 954.5]
h = 6.0

[[block]]
name = "GroveL2"
bbox = [662, 979.9, 764, 1135.5]
h = 6.0

[[block]]
name = "GroveL3"
bbox = [662, 1160.9, 764, 1316.4]
h = 6.0

[[block]]
name = "GroveR1"
bbox = [1156, 799.0, 1258, 954.5]
h = 6.0

[[block]]
name = "GroveR2"
bbox = [1156, 979.9, 1258, 1135.5]
h = 6.0

[[block]]
name = "GroveR3"
bbox = [1156, 1160.9, 1258, 1316.4]
h = 6.0

# The white ceramic LoRa chip antenna (RainSun) and the GNSS patch antenna, a tan ceramic bar
# with a silver top.
[[block]]
name = "AntennaLoRa"
bbox = [679, 538.7, 869, 618.0]
h = 2.5
side_color = "#f2f0ea"

[[block]]
name = "AntennaGNSS"
bbox = [1028, 514.3, 1229, 593.6]
h = 4.0
