# seeed_wio_tracker_l2: Wio Tracker L2. The flasher's illustration is a true front view of the case,
# but it draws the antenna leaning out to the right. On the real device the antenna's lower section
# runs up a channel in the back-left corner (seen from the front) from an RP-SMA connector, and the
# whip stands upright from a joint at the top or folds flat across the back. So the drawn antenna is
# left out and an upright one is built where it really is.
# Seeed wiki: "(Antenna folded) L: 87.5, W: 69, H: 26.6" (the wiki says cm, clearly mm), 171.5 g:
# https://wiki.seeedstudio.com/meshtastic_wio_tracker_l2_intro/
# 87.5 x 69 is the front: the drawn case is 549 x 431.6 units (0.786; 69/87.5 = 0.789), and the
# straight-on back render in the wiki's hardware overview measures 2360 x 1862 px (0.789):
# https://files.seeedstudio.com/wiki/SenseCAP/Wio_Tracker_L2/L2DeviceComponent29.7(2).png
# Everything on the back, sides, top and bottom is measured from that back render (26.97 px/mm)
# or estimated from the 3/4 renders in the same image and the wiki's front photo (L2First.png).
# The published 26.6 mm depth is with the antenna folded flat across the back, so the case itself
# is 26.6 less the whip's ~8 mm: 18.6 mm, estimated. No CAD or dimension drawing is published.
# Model frame: x from the center line as seen from the front, y up from the bottom, z out of the
# screen with 0 the middle of the case (front +9.3, back -9.3).

[size]
width_mm = 87.5
height_mm = 69.0
depth_mm = 18.6
scale_by = "width"
fit_bbox = [0.4, 295.6, 549.4, 727.2]
appendage = "none"
covers = "case; the antenna is built upright, 72 mm above the top (estimated)"
source = "https://wiki.seeedstudio.com/meshtastic_wio_tracker_l2_intro/"
confidence = "vendor (front); depth and back estimated from renders"
# Rugged case with soft corners; small front radius keeps the drawn bezel.
edge_radius_mm = 3.0
front_edge_radius_mm = 1.2
body_color = "#3f3e3e"

[materials]
case   = { color = "#3f3e3e", roughness = 0.75 }
rubber = { color = "#232323", roughness = 0.8 }
brass  = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
port   = { color = "#1d1d1f", roughness = 0.6 }
yellow = { color = "#f2b705", roughness = 0.5 }
orange = { color = "#e88a1a", roughness = 0.5 }
silver = { color = "#b8b8b6", roughness = 0.3, metallic = 1.0 }
grove  = { color = "#efede6", roughness = 0.6 }
groove = { color = "#161616", roughness = 0.9 }

# The drawn antenna (cls-6) and its two band marks (the large cls-5 shapes; the small cls-5
# rects are the sound slots and stay).
[[part]]
name = "DrawnAntenna"
class = "cls-6"
role = "skip"

[[part]]
name = "DrawnAntennaBands"
class = "cls-5"
min_width_mm = 3
role = "skip"

# The antenna, 7 mm in from the left edge (front photo; 5.9 mm on the back render) and set into
# the back. Lower section in its channel from the RP-SMA connector 36 mm up to the top, the joint,
# then the whip. Whip 7.5 mm thick widening to 8.4 at its base (front photo); its length, 72 mm
# above the top, is estimated from the front photo and the folded whip on the back render (65-80).
[[lathe]]
name = "AntennaPin"
material = "brass"
axis_x = 41.5
y_bottom = 514.5
y_top = 503.8
radius = 6.3
z = -5.3

[[lathe]]
name = "AntennaConnector"
material = "brass"
axis_x = 41.5
y_bottom = 503.8
y_top = 486.3
radius = 26.7
z = -5.3

[[lathe]]
name = "AntennaLower"
material = "rubber"
axis_x = 41.5
y_bottom = 486.3
y_top = 294.3
radius = 28.5
z = -5.3

[[lathe]]
name = "AntennaJoint"
material = "rubber"
axis_x = 41.5
y_bottom = 294.3
y_top = 225.3
radius = 26.4
z = -5.3

[[lathe]]
name = "AntennaWhip"
material = "rubber"
axis_x = 41.5
y_bottom = 225.3
y_top = -157.5
radius = 23.5
dome = true
z = -5.3

