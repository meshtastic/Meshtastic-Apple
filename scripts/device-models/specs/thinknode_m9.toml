# thinknode_m9: phone-style case, all antennas internal (vendor page).
# Elecrow: Size 126*67*10.3mm, 123 g. 67/126=0.53 matches drawn 0.54.

[size]
width_mm = 67.0
height_mm = 126.0
depth_mm = 10.3
