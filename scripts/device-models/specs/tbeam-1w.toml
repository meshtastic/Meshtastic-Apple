# tbeam-1w: LILYGO T-Beam 1W, front view.
# Size: https://wiki.lilygo.cc/products/t-beam-series/t-beam-1w/
# The CAD shows 18.5 deep but models no fan; the vendor's 27 is used for the shipped unit.
# Built as a 1.6 mm board with its OLED 3 mm up, on the 18650 holder and fan behind it, which take up the rest of the published 27 mm (estimates).
[size]
width_mm = 43
height_mm = 133
depth_mm = 27
board_mm = 1.6
scale_by = "width"
covers = "board with fan and holder; the SMA and antenna are built round"
source = "https://wiki.lilygo.cc/products/t-beam-series/t-beam-1w/"
confidence = "vendor"

[[block]]
name = "Display"
bbox = [29.4, 118.9, 210.3, 264.6]
h = 3.0

# Behind the board (LILYGO's back photo, estimates): the 30 mm fan on its heatsink behind the
# upper part, and the 18650 sled over the lower half, with the board showing around both.
[[block]]
name = "Fan"
bbox = [38.0, 120.0, 200.0, 282.0]
h = 12.0
radius_mm = 2.0
back = true
side_color = "#1c1c1c"

[[block]]
name = "BatterySled"
bbox = [20.0, 340.0, 218.0, 642.0]
h = 22.0
radius_mm = 2.0
back = true
side_color = "#1c1c1c"

[materials]
brass = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
whip = { color = "#1e1e1e", roughness = 0.6 }

# The SMA connector's thread, drawn flat at the top right, built round.
[[antenna]]
name = "SMA"
start = [194.4, 40.4]
end = [194.4, 0.5]
material = "brass"
dome = false

# LILYGO doesn't give the 1W's antenna; this is the T-Beam Supreme's (84 mm, 8.7 mm across at the
# base, 6 at the tip), standing on the SMA above the drawing.
[[antenna]]
name = "Antenna"
start = [194.4, 0.5]
end = [194.4, -453.5]
radius_mm = 4.33
tip_radius_mm = 3.03
material = "whip"
