# rak2560: the RAK WisMesh Repeater (RAK10721), built in the RAK2560 Sensor Hub enclosure;
# DeviceHardware.json maps rak2560 to it. The flasher's illustration draws the case in RAK blue
# with sensor cables plugged into both ports, so this uses our own front drawing (drawings/) in
# the repeater's two grays, with the ports capped and the antenna on top.
# Size from the hub datasheet: 120 x 80 x 39 mm, and the body-dimension figure (80 x 120 mm front):
# https://docs.rakwireless.com/product-categories/wisnode/rak2560/hub-datasheet/
# https://images.docs.rakwireless.com/wisnode/rak2560/hub-datasheet/body-dimensions.png
# The ports, antenna and back are estimated from RAK's photos:
# https://cdn.shopify.com/s/files/1/0177/8784/6756/files/WisMesh_Meshtastic-repeater.png
# https://cdn.shopify.com/s/files/1/0177/8784/6756/files/WisMesh_Meshtastic-repeater-mounted.png
# https://cdn.shopify.com/s/files/1/0177/8784/6756/files/SensorHub_01.png (front) and SensorHub_04.png (back)
# Model frame: x from the center line, y up from the bottom, z out of the front with 0 the middle
# of the body (front at +19.5, back at -19.5).
drawing = "drawings/rak2560.svg"

[size]
width_mm = 80.0
height_mm = 120.0
depth_mm = 39.0
scale_by = "width"
appendage = "none"
covers = "enclosure; the ports and antenna are built outside it"
source = "https://docs.rakwireless.com/product-categories/wisnode/rak2560/hub-datasheet/"
confidence = "vendor"
# Rounded all round, a little more at the back (photos).
edge_radius_mm = 4.0
front_edge_radius_mm = 3.0

[materials]
case   = { color = "#c4c5c7", roughness = 0.6 }
door   = { color = "#b4b5b8", roughness = 0.6 }
screw  = { color = "#9a9b9e", roughness = 0.35, metallic = 1.0 }
port   = { color = "#1a1a1a", roughness = 0.6 }
blue   = { color = "#1a4fa3", roughness = 0.45 }
rubber = { color = "#1f2022", roughness = 0.8 }

# Two sensor-port connectors under the case, 11.2 mm either side of the center (figure). Each is
# a black panel nut, about 15 mm across and 7 mm deep, with a blue cap, about 13 mm across and
# 8 mm, and a small stub (photos). Their front-to-back position isn't shown straight on in any
# photo, so they sit at the middle of the depth. The caps' tether loops are left out.
[[lathe]]
name = "PortLeftNut"
material = "port"
axis_x = 28.8
y_top = 120
y_bottom = 127
radius = 7.5
confidence = "estimated from photos"

[[lathe]]
name = "PortLeftCap"
material = "blue"
axis_x = 28.8
y_top = 127
y_bottom = 135
radius = 6.5
confidence = "estimated from photos"

[[lathe]]
name = "PortLeftStub"
material = "blue"
axis_x = 28.8
y_top = 135
y_bottom = 137
radius = 2.0
confidence = "estimated from photos"

[[lathe]]
name = "PortRightNut"
material = "port"
axis_x = 51.2
y_top = 120
y_bottom = 127
radius = 7.5
confidence = "estimated from photos"

[[lathe]]
name = "PortRightCap"
material = "blue"
axis_x = 51.2
y_top = 127
y_bottom = 135
radius = 6.5
confidence = "estimated from photos"

[[lathe]]
name = "PortRightStub"
material = "blue"
axis_x = 51.2
y_top = 135
y_bottom = 137
radius = 2.0
confidence = "estimated from photos"

# The antenna on the top face, measured on the straight-on mounted photo (5.3 px/mm on the 80 mm
# case, 2048 px image): 23.8 mm from the left edge, 154 mm tall. From the case up: a nut 9.8 mm
# across, the base 11.3 mm across to 31 mm, a taper to 50 mm, a 4 mm section to 78 mm, the 2.5 mm
# whip, ending in an even dome rather than the photo's slightly wider tip. The isometric product photo looks closer to the middle, so the position
# is less certain than the length; the depth position isn't shown and it sits at mid-depth.
[[lathe]]
name = "AntennaNut"
material = "rubber"
axis_x = 23.8
y_bottom = 0
y_top = -7.7
radius = 4.9
confidence = "estimated from photos"

[[lathe]]
name = "AntennaBase"
material = "rubber"
axis_x = 23.8
y_bottom = -7.7
y_top = -31.3
radius = 5.65
confidence = "estimated from photos"

[[lathe]]
name = "AntennaTaper"
material = "rubber"
axis_x = 23.8
y_bottom = -31.3
y_top = -50.2
radius = 3.6
confidence = "estimated from photos"

[[lathe]]
name = "AntennaLower"
material = "rubber"
axis_x = 23.8
y_bottom = -50.2
y_top = -78.5
radius = 2.0
confidence = "estimated from photos"

[[lathe]]
name = "AntennaWhip"
material = "rubber"
axis_x = 23.8
y_bottom = -78.5
y_top = -154.0
radius = 1.3
dome = true
confidence = "estimated from photos"

# Back: the battery door, about 66 x 94 mm, held by four screws, and four more screws near the
# corners of the back (SensorHub_04.png, about 4.5 px/mm at the back face). The door is recessed
# in a rim on the real case; here it is a thin plate.
