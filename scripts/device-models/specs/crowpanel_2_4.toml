# crowpanel_2_4: Elecrow CrowPanel Advance 2.4 in its case. The flasher's illustration is the bare
# board (no case), so this model is built from our own front drawing (drawings/) and parts placed
# in mm. Every figure is measured from Elecrow's current STEP, used for measurement only:
# https://github.com/Elecrow-RD/CrowPanel-Advance-2.4-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-320x240/tree/master/3D%20file
# advance-hmi2_4-20260126.stp (v1.4, sha256 b1eb9fbdb0947a018d16fbe3487717319334f869f9f82e98025bb8b9fd79cfca).
# The store page's 77.1 x 51.8 x 15.8 mm and its photos are the older v1.0 case (00-24_asm.stp:
# 77.2 x 51.9 x 16 mm, BOOT/RESET through holes in the back, no seam, no screws on the front).
# v1.4 is 74.8 x 51.9: a front shell and a back shell with the board showing between them, screws
# at the corners front and back, a lidded module bay and a cutout at the BOOT/RESET corner, the
# same case Elecrow's 2.8 back photo shows. This follows v1.4.
# The "2.4"" on the flasher's drawing is screen content, not printed on the device, so it's left out.
# Model frame: x from the center line, y up from the bottom, z out of the display with 0 the
# middle of the case; the CAD's 36.4 - x, y + 2.2 and 0.65 - z give these.
drawing = "drawings/crowpanel_2_4.svg"

[size]
width_mm = 74.8
height_mm = 51.9
# Case front to the back plate. The display glass stands 0.2 mm proud and the screw heads 1.0 mm
# on each side: 16.7 mm over the screws.
depth_mm = 14.7
scale_by = "width"
covers = "case; screw heads add 1 mm front and back"
source = "https://raw.githubusercontent.com/Elecrow-RD/CrowPanel-Advance-2.4-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-320x240/master/3D%20file/advance-hmi2_4-20260126.stp"
confidence = "cad"
edge_radius_mm = 0.3
front_edge_radius_mm = 0.5

[materials]
c_1d1d1f = { color = "#1d1d1f", roughness = 0.6 }
acrylic  = { color = "#0b0b0c", roughness = 0.12 }
opening  = { color = "#060606", roughness = 0.9 }
seam     = { color = "#0e0e0f", roughness = 0.8 }
screw    = { color = "#2a2a2c", roughness = 0.45, metallic = 0.8 }
jst      = { color = "#ece6d6", roughness = 0.5 }
jst_in   = { color = "#c9c0ac", roughness = 0.6 }
metal    = { color = "#a9abae", roughness = 0.35, metallic = 1.0 }

# The display glass stands 0.2 mm off the case; the flex slot and the hole are openings, so
# they're painted flush.
[[part]]
name = "Glass"
class = "glass"
z = 0
h = 0.2

[[part]]
name = "Display"
class = "display"
z = 0
h = 0.22

[[part]]
