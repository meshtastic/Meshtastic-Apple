# seeed_wio_tracker_l1_pro_1w: the Wio Tracker L1 Pro 1W (hw model 144; the same L1 board family
# with a 1 W PA, per meshtastic/firmware variants/nrf52840/seeed_wio_tracker_L1_Pro_1W). Seeed has
# no product page or CAD for it yet. The flasher's illustration is the L1 Pro drawing shape for
# shape, recolored violet with a "1W" badge, so this assumes the L1 Pro case and copies
# wio_tracker_l1_case.toml: size, back and sides measured from Seeed's L1 Pro enclosure CAD, used
# for measurement only:
# https://files.seeedstudio.com/wiki/SenseCAP/wio_tracker/L1pro%203D%20Enclosure.zip
# (sha256 b011f41e4ef11eba9cac168916814d0332137adf5b3a873fe31c649dc58932c4).
# That it shares the case is not confirmed. Model frame: x from the center line as seen from the
# front, y up from the bottom, z out of the front with 0 the middle of the body.

[size]
width_mm = 54.0
height_mm = 72.0
depth_mm = 23.0
scale_by = "width"
# The case outline; the antenna above it and the side bezel left of it are built separately.
fit_bbox = [561.14, 519.33, 864.86, 925.0]
covers = "case: 54 x 72 x 23 mm body plus the 2.5 mm back pad, with the antenna folded as drawn"
# The back edge is a 4-5 mm chamfer down to the pad; the front edge a 1.5 mm round.
edge_radius_mm = 4.0
front_edge_radius_mm = 1.5
source = "https://files.seeedstudio.com/wiki/SenseCAP/wio_tracker/L1pro%203D%20Enclosure.zip"
confidence = "estimated"  # the L1 Pro case CAD, assuming the 1W uses it

[materials]
# The drawing's violet case and yellow caps are kept; the case color isn't confirmed either.
rubber   = { color = "#353535", roughness = 0.80 }
brass    = { color = "#e0b77b", roughness = 0.30, metallic = 1.0 }
cap      = { color = "#dfeb6f", roughness = 0.6 }
port     = { color = "#1d1d1f", roughness = 0.6 }
hole     = { color = "#0e0e10", roughness = 0.9 }
groove   = { color = "#6f4d8a", roughness = 0.8 }
case     = { color = "#8b61ab", roughness = 0.6 }

# The side caps are built by measurement below, so the drawing's slivers of them are left out.
[[part]]
class = "cls-3"
role = "skip"

# Round "1W" variant badge on the top-left corner: a drawing mark, not part of the device. The
# size-limited white circle rule keeps the white logo stroke.
[[part]]
fill = ["#66e792", "#202938"]
role = "skip"

[[part]]
fill = "#ffffff"
shape = "circle"
min_width_mm = 10.5
max_width_mm = 11.5
role = "skip"

# Rubber whip, folded out at the hinge.
[[antenna]]
name = "AntennaWhip"
start = [816.5, 412.4]
end = [435, 38]
dome = true
material = "rubber"

# SMA connector on the case top (CAD: x 15.0, centered in depth, in a 12.6 mm collar): base and
# brass ring (fixed radius; the probe misses them), then nut and ferrule.
[[antenna]]
name = "AntennaBase"
start = [799.2, 547.6]
end = [799.2, 541.9]
radius_mm = 6.2
dome = false

[[antenna]]
name = "AntennaBrass"
start = [799.2, 541.9]
end = [799.2, 531.6]
radius_mm = 5.0
dome = false
material = "brass"

[[antenna]]
name = "AntennaConnector"
start = [799.2, 531.6]
end = [799.2, 419]
dome = false

# Hinge knuckle between connector and whip, as a rounded cap.
[[antenna]]
name = "AntennaHinge"
start = [799.2, 419]
end = [799.2, 396]
radius_mm = 4.6
dome = true
material = "rubber"

# Left side: the raised bezel around the two caps, 1 mm proud, y 30-50.6 and z 2.1-9.5.
[[thin]]
name = "SideBezel"
bbox = [554, 637.0, 561.2, 755.8]
depth_mm = 7.4
z_mm = 5.8
edge_radius_mm = 0.5

# The caps in it: the switch cap in the 7 x 5 opening and the button cap in the 5 x 5 one above
# it. How far they stand out is estimated from Seeed's photos (gallery image 5).
[[solid]]
name = "SwitchCap"
material = "cap"
center_mm = [-28.0, 35.0, 5.84]
size_mm = [1.2, 6.4, 4.4]
radius_mm = 0.6

[[solid]]
name = "ButtonCap"
material = "cap"
center_mm = [-28.0, 44.9, 5.84]
size_mm = [1.2, 4.4, 4.4]
radius_mm = 0.6

# Left side, below the bezel: USB-C (the case opening is 9.5 x 3.8) and three 2 mm holes for the
# light pipes and the charge LED.
[[solid]]
name = "USBC"
material = "port"
center_mm = [-27.05, 21.2, 5.83]
size_mm = [0.4, 8.9, 3.2]
radius_mm = 1.6

[[solid]]
name = "SideHole1"
material = "hole"
center_mm = [-27.05, 29.0, 4.8]
size_mm = [0.3, 2.0, 2.0]
radius_mm = 1.0

[[solid]]
name = "SideHole2"
material = "hole"
center_mm = [-27.05, 13.5, 4.8]
size_mm = [0.3, 2.0, 2.0]
radius_mm = 1.0

[[solid]]
name = "SideHole3"
material = "hole"
center_mm = [-27.05, 10.0, 4.8]
size_mm = [0.3, 2.0, 2.0]
radius_mm = 1.0

# Right side: eight grip grooves, 2 mm wide and 0.5 mm deep across most of the depth. The generator
# can't cut grooves, so they are drawn as dark strips on the surface.
