# muzi_r1_neo: muzi works R1 Neo. The flasher's illustration is a front view with the bevels
# shaded in, so this uses our own front drawing in mm (drawings/), built from these measurements.
# muzi works publishes the case as 58.0 x 63.5 x 17.8 mm and the antenna as 17 cm:
# https://muzi.works/products/r1-neo-complete-meshtastic-device
# No CAD or dimension drawing is published. Everything else is measured from muzi's product
# photos (front P1000223, back P1000227, side P1000232, bottom P1000236, red P1000215) and its
# top-view render of the button (Integrated_Button_Indicator.jpg), each scaled to the published
# 58 mm width, so those figures are estimated from photos.
# Shape: a 3D-printed shell on an anodized aluminum base. The front is a flat panel with three
# bevels: 9.1 mm wide on the left, 16.9 mm on the right and 11.4 mm along the top, each dropping
# 6.7 mm to the side walls, which are 11.1 mm deep. The aluminum base is 11.3 mm tall on the sides
# and back and 7.4 mm on the front panel. The top-left corner is cut away on a diagonal; behind it
# a notch open to the back and the left side holds the SMA connector and the antenna, and the
# bevels form a thin cheek in front of it.
# The generator can't slope a face, so the bevels are tilted strips ([[solid]]s, 1 mm wide),
# stepped where they meet the diagonal, the corners and the base seam; the parts below are built
# as layers between set depths, which leaves their edges square.
# Color: the illustration is maroon; of the five colors sold, Red is the one it shows, a brick
# red in muzi's photos.
# Model frame: x from the center line, y up from the bottom, z out of the front, 0 the middle.
name = "R1Neo"
drawing = "drawings/muzi_r1_neo.svg"
auto = false

[size]
width_mm = 58.0
height_mm = 63.5
depth_mm = 17.8
covers = "case, excludes antenna"
source = "https://muzi.works/products/r1-neo-complete-meshtastic-device"
confidence = "vendor"

[materials]
case    = { color = "#b0402c", roughness = 0.75 }
base    = { color = "#1c1c1e", roughness = 0.4, metallic = 0.6 }
button  = { color = "#ecebe8", roughness = 0.5, opacity = 0.95 }
rubber  = { color = "#1f2022", roughness = 0.8 }
brass   = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
port    = { color = "#0d0d0f", roughness = 0.6 }
gasket  = { color = "#2c2c2e", roughness = 0.7 }
screw   = { color = "#3a3a3c", roughness = 0.4, metallic = 1.0 }
slot    = { color = "#141416", roughness = 0.8 }

# Behind the bevels: the case from the back to the bevels' outer edge (z -8.9 to 2.2), with the
# antenna notch (16.5 mm wide, 24.5 mm deep from the top) left open. The notch wall runs straight
# up to the top with a 3 mm round at the corner (back photo P1000227); the front diagonal is only
# on the bevels. Below the base seam it's aluminum.
[[part]]
name = "Shell"
class = "back"
z = -17.8
h = 11.1
material = "case"

[[part]]
name = "Base"
class = "back-base"
z = -17.8
h = 11.1
material = "base"

# The flat front panel, from the bevels' outer edge up to the front (z 2.2 to 8.9). Over the
# notch it starts at z 4.2 to clear the antenna.
[[part]]
name = "Panel"
class = "panel"
z = -6.7
h = 6.7
material = "case"

[[part]]
name = "PanelOverNotch"
class = "panel-notch"
z = -4.7
h = 4.7
material = "case"

[[part]]
name = "PanelBase"
class = "panel-base"
z = -6.7
h = 6.7
material = "base"

# The drawing's bevels, button and lanyard slot are for the picture; they're built below.
[[part]]
name = "DrawnOnly"
class = ["bevel-left", "bevel-right", "bevel-top", "bevel-base", "button", "slot"]
role = "skip"

# Antenna: on the SMA connector at the notch floor (39 mm up), 9.7 mm in from the left edge and
# about mid-depth (top-view render). From the front photo: a 9 mm sleeve tapering to 6.5 mm at
# 71 mm up, then a 4.4 mm whip ending 208 mm up, so 169 mm from the connector against the
# published 17 cm. The photo's slightly wider end cap is left out; the whip ends in an even dome.
[[lathe]]
name = "AntennaConnector"
axis_x = 9.7
y_bottom = 24.5
y_top = 21.0
radius = 3.2
z = -0.6
material = "brass"

[[lathe]]
name = "AntennaSleeve"
axis_x = 9.7
y_bottom = 21.0
y_top = 5.5
radius = 4.5
z = -0.6
material = "rubber"

[[lathe]]
name = "AntennaTaper1"
axis_x = 9.7
y_bottom = 5.5
y_top = 0.5
radius = 4.1
z = -0.6
material = "rubber"

[[lathe]]
name = "AntennaTaper2"
axis_x = 9.7
y_bottom = 0.5
y_top = -4.0
radius = 3.7
z = -0.6
material = "rubber"

[[lathe]]
name = "AntennaTaper3"
axis_x = 9.7
y_bottom = -4.0
y_top = -7.4
radius = 3.25
z = -0.6
material = "rubber"

[[lathe]]
name = "AntennaWhip"
axis_x = 9.7
y_bottom = -7.4
y_top = -144.4
radius = 2.2
dome = true
z = -0.6
material = "rubber"

# Top: the one button, a white soft-touch stadium 14.2 x 6.5 mm that lights up as the status LED.
# It sits about mid-depth and runs a little over the top bevel, so it shows from the front.
[[solid]]
name = "Button"
material = "button"
center_mm = [-4.5, 62.35, 0.2]
size_mm = [14.2, 3.0, 6.5]
radius_mm = 3.25
confidence = "estimated from photos"

# The lanyard slot through the top-right corner, 2.9 x 7 mm: dark insets on the right bevel and
# the back, since the generator can't cut through.
[[solid]]
name = "SlotFront"
material = "slot"
center_mm = [25.65, 53.1, 3.53]
size_mm = [3.1, 7.0, 0.3]
radius_mm = 1.45
rotate_deg = [0, 21.6, 0]
confidence = "estimated from photos"

[[solid]]
name = "SlotBack"
material = "slot"
center_mm = [25.65, 53.1, -8.83]
size_mm = [2.9, 7.0, 0.2]
radius_mm = 1.45
confidence = "estimated from photos"

# Bottom: the sealed USB-C near the left end in its gasket, and a screw at each end. The printed
# label between them is left out. Their depth is hard to read from the photo; estimated.
[[solid]]
name = "USBCGasket"
material = "gasket"
center_mm = [-16.3, -0.05, -4.0]
size_mm = [11.3, 0.3, 5.0]
radius_mm = 2.5
confidence = "estimated from photos"

[[solid]]
name = "USBC"
material = "port"
center_mm = [-16.3, -0.1, -4.0]
size_mm = [9.0, 0.4, 3.3]
radius_mm = 1.6
confidence = "estimated from photos"

[[solid]]
name = "ScrewLeft"
