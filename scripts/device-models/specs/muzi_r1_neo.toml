center_mm = [-25.0, -0.05, -5.5]
size_mm = [2.2, 0.3, 2.2]
radius_mm = 1.1
confidence = "estimated from photos"

[[solid]]
name = "ScrewRight"
material = "screw"
center_mm = [25.0, -0.05, -5.5]
size_mm = [2.2, 0.3, 2.2]
radius_mm = 1.1
