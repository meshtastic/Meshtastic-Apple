# crowpanel_5_0: the CrowPanel Advance 5.0" in Elecrow's black acrylic case. The flasher's
# illustration is the bare board's front, so this uses our own front drawing (drawings/) and
# places the back and side parts in mm. Every figure is measured from Elecrow's published STEP,
# used for measurement only:
# https://github.com/Elecrow-RD/CrowPanel-Advance-5-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-800x480/tree/master/3D%20file
# (advance-hmi5_0-20260116.stp, sha256 cdbc75630a750ff035c677e0df8c9cfbedcc65f10398ca940265f272b886883d).
# The store lists 136.4 x 84.7 x 15.4 mm; the CAD's case is 134.0 x 84.7 x 15.7, used here.
# The display area (108 x 65, from the store) sits higher on the glass than centered, as in
# Elecrow's hardware overview photo; its vertical place is estimated from that photo.
# Model frame: x from the center line, y up from the bottom, z out of the front with 0 the
# middle of the body. The CAD looks at the back, so x = 66 - CAD x, y = CAD y + 2.2 and
# z = 0.15 - CAD z.
# Not built: the 1.7 mm seam around the sides where the board sits between the front frame and
# the back shell (the generator can't cut a groove), and the depth of the openings, which are
# drawn flush as dark panels.
drawing = "drawings/crowpanel_5_0.svg"

[size]
width_mm = 134.0
height_mm = 84.7
depth_mm = 15.7
scale_by = "width"
covers = "case without the screw heads, which stand 1 mm off the front and back"
source = "https://github.com/Elecrow-RD/CrowPanel-Advance-5-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-800x480/tree/master/3D%20file"
confidence = "cad"
body_color = "#1b1b1d"
# Laser-cut acrylic layers: square edges.
edge_radius_mm = 0.5
front_edge_radius_mm = 0.5

[materials]
body      = { color = "#1b1b1d", roughness = 0.3 }
c_0c0c0e  = { color = "#0c0c0e", roughness = 0.1 }
c_18191d  = { color = "#18191d", roughness = 0.1 }
c_97621d  = { color = "#97621d", roughness = 0.5 }
hole      = { color = "#070708", roughness = 0.8 }
connector = { color = "#ecebe3", roughness = 0.5 }
usb       = { color = "#a8a8a6", roughness = 0.35, metallic = 1.0 }
brass     = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
button    = { color = "#c9c9c6", roughness = 0.5 }
screw_back  = { color = "#2a2a2c", roughness = 0.4, metallic = 1.0 }
screw_front = { color = "#d6d6d2", roughness = 0.35, metallic = 1.0 }

# The notch on the right side for BOOT and RESET runs through the back shell down to the board,
# 9 x 19.2 mm; only the front frame and board (7.7 mm) stay there.
[[thin]]
bbox = [125.0, 42.9, 135.0, 62.1]
depth_mm = 7.7
z_mm = 4.0

