# rak4631_case: the RAK WisMesh Pocket V2 (RAK10709), the RAK4631 in RAK's 3D-printed case. The
# flasher's drawing matches it closely: same outline, corner screws, ribs, label window, lanyard
# tab and SMA whip, at the same positions as in RAK's CAD (within about 0.5 mm). It is the white
# version. Figures are measured from the Pocket V2 enclosure CAD that RAK's designer published as
# CC0, used for measurement only:
# https://www.printables.com/model/1374446-rakwireless-wismesh-pocket-v2
# ("pocketv2_asm-Aug-07 v2.step", sha256 f06030a6237c254fa463217e62515cd895602b04c455bcb54ad3deae96671c78).
# Model frame: x from the center line, y up from the bottom, z out of the label face with 0 the
# middle of the body. From the CAD: x, 42.5 - z and y - 3.5 give these.

[size]
width_mm = 52.0
height_mm = 94.0
depth_mm = 30.0
scale_by = "width"
# Case plus the tab on top, not the antenna.
fit_bbox = [756.66, 647.59, 1306.76, 1636.87]
appendage = "none"
# The case edges are rounded about 2.5 mm front and back.
edge_radius_mm = 2.5
front_edge_radius_mm = 2.0
covers = "case including the lanyard tab, excludes the antenna (51 mm whip, built)"
source = "https://www.printables.com/model/1374446-rakwireless-wismesh-pocket-v2"
confidence = "cad"

[materials]
port   = { color = "#1d1d1f", roughness = 0.6 }
button = { color = "#2d2d2d", roughness = 0.6 }
rib    = { color = "#c8cccb", roughness = 0.55 }
nut    = { color = "#999999", roughness = 0.35, metallic = 1.0 }

# Rubber whip on a brass SMA connector, 2.5 mm in front of the middle of the body.
[[antenna]]
name = "Antenna"
start = [922.93, 741.6]
end = [922.93, 174.42]
z_mm = 2.5
dome = true

# Lanyard tab on top right: 8 mm thick, 0.5 mm in front of the middle.
[[thin]]
bbox = [1180, 647.59, 1307, 742]
depth_mm = 8.0
z_mm = 0.5
edge_radius_mm = 1.0

# Right side: the button (a small black cap in an oval flex cut) and the power slide switch.
[[solid]]
name = "Button"
material = "button"
center_mm = [26.0, 58.1, 2.3]
size_mm = [0.6, 2.6, 2.6]
radius_mm = 1.3

[[solid]]
name = "SwitchSlot"
material = "port"
center_mm = [26.0, 15.6, 1.65]
size_mm = [0.4, 11.0, 5.0]
radius_mm = 0.8

[[solid]]
name = "SwitchKnob"
material = "button"
center_mm = [26.1, 18.0, 1.65]
size_mm = [0.8, 3.5, 3.0]
radius_mm = 0.5

[[solid]]
name = "SideHole"
material = "port"
center_mm = [26.0, 6.4, 2.0]
size_mm = [0.4, 2.8, 2.8]
radius_mm = 1.4

# Bottom: USB-C, three light holes to its left and one to its right (as seen from the front).
[[solid]]
name = "USBC"
material = "port"
center_mm = [4.3, -0.1, 3.8]
size_mm = [8.9, 0.4, 3.2]
radius_mm = 1.6

[[solid]]
name = "BottomHole1"
material = "port"
center_mm = [-12.0, -0.1, 4.0]
size_mm = [1.6, 0.4, 1.6]
radius_mm = 0.8

[[solid]]
name = "BottomHole2"
material = "port"
center_mm = [-8.3, -0.1, 4.0]
size_mm = [1.6, 0.4, 1.6]
radius_mm = 0.8

[[solid]]
name = "BottomHole3"
material = "port"
center_mm = [-3.5, -0.1, 4.0]
size_mm = [2.5, 0.4, 2.5]
radius_mm = 1.25

[[solid]]
name = "BottomHole4"
material = "port"
center_mm = [14.0, -0.1, 4.0]
size_mm = [1.6, 0.4, 1.6]
radius_mm = 0.8

# Front: the M3 socket screw heads in the corner pockets, under the drawing's hex sockets. The
# pockets themselves (about 10 mm square, 5.5 mm deep, open to the sides) can't be cut.
[[solid]]
name = "ScrewLowerLeft"
material = "nut"
center_mm = [-21.64, 3.91, 15.1]
size_mm = [5.5, 5.5, 0.2]
radius_mm = 2.75

[[solid]]
name = "ScrewLowerRight"
material = "nut"
center_mm = [21.64, 3.91, 15.1]
size_mm = [5.5, 5.5, 0.2]
radius_mm = 2.75

[[solid]]
name = "ScrewUpperLeft"
material = "nut"
center_mm = [-21.64, 80.75, 15.1]
size_mm = [5.5, 5.5, 0.2]
radius_mm = 2.75

[[solid]]
name = "ScrewUpperRight"
material = "nut"
center_mm = [21.64, 80.75, 15.1]
size_mm = [5.5, 5.5, 0.2]
radius_mm = 2.75

# Back: the four M3 nuts in the corners and the ribs, which are cut 0.5 mm into the back and are
