# seeed_xiao_nrf52_kit: XIAO nRF52840 & Wio-SX1262 kit. The flasher's illustration is the kit from
# the front: the XIAO nRF52840 on top, with the LoRa antenna on its cable beside it. It stays the
# drawing; the body is the XIAO board and everything behind it is placed in mm.
# Measured from Seeed's published CAD, used for measurement only:
#   XIAO nRF52840: https://files.seeedstudio.com/wiki/XIAO-BLE/seeed-studio-xiao-nrf52840-3d-model.zip
#   (sha256 0ee799787103e54f382a784abd425e841401934356d4e083308cb0f083bf63a8, "XIAO-nRF52840 v15.step")
#   Wio-SX1262 for XIAO: https://files.seeedstudio.com/products/SenseCAP/Wio_SX1262/Wio-SX1262_for_XIAO_3D_file.step
#   (sha256 6a4c8592691cf821314ea96482c5946a64d479317316bfa81e509cec9284782c)
# The stacking is from Seeed's photos (https://www.seeedstudio.com/XIAO-nRF52840-Wio-SX1262-Kit-for-Meshtastic-p-6400.html,
# gallery images 2 to 8): the XIAO's male pin headers plug into female headers on the Wio-SX1262
# board, whose radio module faces up into the gap; the female headers' pins come out under it.
# Header heights are read off the size photo (image 8) with the male header's standard 2.5 mm
# plastic as the scale (about 34 px/mm): the female header is about 6.5 mm and its pins stick out
# about 3.7 mm. The stack comes to about 18 mm with the pins. Seeed's wiki gives "8mm x 22mm x 23mm"
# and the size photo marks 22 mm beside the stack; neither matches the parts, so they aren't used.
# Model frame: x from the center line as seen from the front, y up from the bottom of the XIAO,
# z out of the front with 0 the middle of the XIAO board.

[size]
# Fit the XIAO board; the flat antenna and cable beside it are built thin.
covers = "board stack; antenna and cable not to published size"
appendage_depth_mm = 1.0
appendage = "outside"
# XIAO PCB in the CAD: 17.78 x 20.96 x 1.2 mm. The drawing is 21.68 mm long at this width (3.4% long).
width_mm = 17.78
height_mm = 20.96
fit_bbox = [532, 776, 1002, 1349]
board_mm = 1.2
# Overall, top of the USB-C to the back of the Wio board. The header pins add 3.7 mm.
depth_mm = 14.45
scale_by = "width"
source = "https://files.seeedstudio.com/wiki/XIAO-BLE/seeed-studio-xiao-nrf52840-3d-model.zip"
confidence = "cad"

[materials]
pcb     = { color = "#262626", roughness = 0.6 }
usb     = { color = "#c2c1c0", roughness = 0.3, metallic = 1.0 }
port    = { color = "#1d1d1f", roughness = 0.6 }
header  = { color = "#151515", roughness = 0.6 }
pin     = { color = "#c8c8c4", roughness = 0.3, metallic = 1.0 }
module  = { color = "#c9c9c6", roughness = 0.35, metallic = 1.0 }
gold    = { color = "#d4b77a", roughness = 0.3, metallic = 1.0 }
# The drawing's #353535 (board, flat antennas) and #282828 (antenna cables) are black in Seeed's
# photos.
c_353535 = { color = "#161616", roughness = 0.6 }
c_282828 = { color = "#161616", roughness = 0.5 }

# The drawing shows the USB-C from above as a flat plate; it is built round in mm instead.
[[part]]
name = "DrawnUSBC"
class = "cls-3"
min_width_mm = 7
role = "skip"

# On the XIAO's front: the shield (2.0 mm tall in the CAD), the reset button (0.8 mm) and the
# small blue part at the bottom edge (0.6 mm).
[[block]]
name = "Shield"
bbox = [594, 959, 943, 1252]
h = 2.0
side_color = "#999999"

[[block]]
name = "ResetButton"
bbox = [593, 789, 636, 862]
h = 0.8

[[block]]
name = "BluePart"
bbox = [673, 1294, 765, 1337]
h = 0.6

# USB-C on the XIAO's front, 3.25 mm tall, 7.9 mm long, reaching 1.5 mm past the board's top
# edge: a 5.7 mm box between two round sides (lathes), 8.94 mm across.
[[solid]]
name = "USBC"
material = "usb"
center_mm = [0, 19.23, 2.225]
size_mm = [5.69, 7.9, 3.25]

[[lathe]]
name = "USBCSide"
material = "usb"
axis_x = 691.8
y_bottom = 945.1
y_top = 736.3
radius = 42.96
z = 2.225

[[lathe]]
name = "USBCSide"
material = "usb"
axis_x = 842.2
y_bottom = 945.1
y_top = 736.3
radius = 42.96
z = 2.225

[[solid]]
name = "USBCOpening"
material = "port"
center_mm = [0, 23.23, 2.225]
size_mm = [7.9, 0.2, 2.2]
radius_mm = 1.1

# Behind the XIAO: the male headers' plastic (2.5 mm), then the female headers (6.5 mm), two rows
# of seven at 2.54 mm pitch, 15.24 mm apart.
[[solid]]
name = "MaleHeaderLeft"
material = "header"
center_mm = [-7.62, 10.84, -1.85]
size_mm = [2.54, 17.78, 2.5]

[[solid]]
name = "MaleHeaderRight"
material = "header"
center_mm = [7.62, 10.84, -1.85]
size_mm = [2.54, 17.78, 2.5]

[[solid]]
name = "FemaleHeaderLeft"
material = "header"
center_mm = [-7.62, 10.84, -6.35]
size_mm = [2.54, 17.78, 6.5]
confidence = "estimated from photos"

[[solid]]
name = "FemaleHeaderRight"
material = "header"
center_mm = [7.62, 10.84, -6.35]
size_mm = [2.54, 17.78, 6.5]
confidence = "estimated from photos"

# The Wio-SX1262 board, 17.78 x 21.44 mm, centered under the XIAO, module side up. Its CAD
# board is 1.6 mm but the photos show about 1 mm (see seeed-xiao-s3.toml); 1.0 mm is estimated.
[[solid]]
name = "WioBoard"
material = "pcb"
center_mm = [0, 10.84, -10.1]
size_mm = [17.78, 21.44, 1.0]
radius_mm = 1.5

# The radio module (11.0 x 11.6 mm, 2.95 mm tall, from the module datasheet and the CAD) at the
# Wio's bottom edge, its lower right corner cut away for the u.FL (1.3 mm tall), which the
# antenna cable plugs into.
[[solid]]
name = "RadioModule"
material = "module"
center_mm = [0, 7.92, -8.125]
size_mm = [11.0, 8.2, 2.95]

[[solid]]
name = "RadioModule"
material = "module"
center_mm = [-1.5, 2.12, -8.125]
size_mm = [8.0, 3.4, 2.95]

[[solid]]
name = "LoRaUFL"
material = "gold"
center_mm = [4.35, 2.22, -8.95]
size_mm = [2.5, 2.5, 1.3]
radius_mm = 1.25

# The female headers' pins under the Wio board.
