# The flat LoRa antenna, about 0.3 mm thick. The polygon leaves out the coax cable where it meets
# the antenna so the cable keeps its round 1.0 mm. The cable is built in the XIAO's plane; it
# really runs to the u.FL on the Wio board behind.
[[thin]]
name = "LoRaFPC"
polygon = [[1303, 303], [1468, 303], [1468, 1350], [1410, 1350], [1410, 1300], [1362, 1300], [1362, 1350], [1303, 1350]]
depth_mm = 0.3
edge_radius_mm = 0.1
