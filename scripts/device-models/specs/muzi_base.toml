# --- SMA, edge mount, from the CAD --------------------------------------------------------------
# Its axis is at CAD x 8.71, z -0.59: 1.35 mm behind the middle of the board, so the connector
# hangs mostly below the board, as in the drawing's side views. Legs straddle the board for 4.0 mm
# (0.95 wide, 0.9 thick each side); a 6.5 mm square flange 1.5 mm long at the edge; a 2.5 mm
# radius neck; the 1/4-36 thread (radius 3.13) from 2.6 to 11.3 mm past the edge; a 2.5 mm radius
# collar to the tip, 12.5 mm past the edge.
