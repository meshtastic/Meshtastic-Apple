# muzi_base: muzi BASE DUO/UNO, a 42 x 32 mm bare board with the Elecrow nRFLR1121 module (DUO) or
# nRFLR1262 module (UNO), an edge-mount SMA at the top, a QWIIC port and, underneath, the USB-C,
# the battery connector and the reset switch.
# The flasher's illustration is a true top view at the CAD's proportions (12.957 units/mm: the
# board runs x 451.3-995.5 = 42.0 mm and y 461.0-875.7 = 32.0 mm). drawings/muzi_base.svg is that
# illustration with two broken arcs in the silkscreen text fixed (see the drawing's comment).
# Measured from muzi works' published CAD and drawing, used for measurement only:
#   https://cdn.shopify.com/s/files/1/0657/6973/4201/files/Base_Duo_MH212A.step
#   (sha256 b698e2a7c9fa083c0b630f958d38d8b9853fd30109d5d17f111da011a9bc45b8)
#   https://cdn.shopify.com/s/files/1/0657/6973/4201/files/Base_Duo_Drawing_Rev01.pdf
#   (sha256 bf09d52688ae43083640c67cd0231aafe4da1805a3770cdba132bcfc3e4cada7): 42.0 x 32.0, PCB 1.6
# Module: Elecrow nRFLR1121 datasheet V1.1, package outline: 20 x 20 mm PCB 1.0 mm thick, 18.5 mm
# shield, 3.5 mm overall. The CAD's module block is 3.7 mm; the datasheet figure is used.
#   https://cdn.shopify.com/s/files/1/0657/6973/4201/files/nRFLR1121_Wireless_Transceiver_Module_Datasheet_V1.1.pdf
# Colors from muzi works' product photos (https://muzi.works/products/base-duo): the castellated
# pads and mounting rings are gold (ENIG), drawn gray in the illustration.
#
# UNO vs DUO (https://muzi.works/products/base-uno): same board, outline and parts placement. The
# UNO carries the nRFLR1262 module (same 20 x 20 x 3.5 mm package, its own datasheet), has no
# 2.4 GHz U.FL connector, and its silkscreen reads UNO. The model follows the DUO, as drawn.
#
# Model frame: x from the center line, y up from the bottom edge, z out of the top face with 0 the
# middle of the PCB (top at +0.8, back at -0.8). CAD to model: x - 21.0, y, z - 0.755 (the CAD's
# board runs z -0.05 to 1.56).

drawing = "drawings/muzi_base.svg"

[size]
width_mm = 42.0
height_mm = 32.0
# Overall: module top (+0.8 + 3.5) to the back of the battery connector (-0.8 - 4.7).
depth_mm = 9.8
board_mm = 1.6
fit_bbox = [451.3, 461.0, 995.5, 875.7]
scale_by = "width"
# The SMA and the USB-C's overhang are built by measurement, not as thin appendages.
appendage = "none"
covers = "PCB 42 x 32; SMA (12.5 mm past the top edge) and USB-C (1.5 mm past the left edge) built separately"
source = "https://cdn.shopify.com/s/files/1/0657/6973/4201/files/Base_Duo_Drawing_Rev01.pdf"
confidence = "cad"

[materials]
enig      = { color = "#d4b26a", roughness = 0.3, metallic = 1.0 }
sma       = { color = "#d8b45c", roughness = 0.3, metallic = 1.0 }
shield    = { color = "#c3c2bd", roughness = 0.35, metallic = 1.0 }
usb       = { color = "#c2c1c0", roughness = 0.3, metallic = 1.0 }
port      = { color = "#1d1d1f", roughness = 0.6 }
jst       = { color = "#e4e1d8", roughness = 0.6 }
switch    = { color = "#e9e8e5", roughness = 0.6 }
plunger   = { color = "#232323", roughness = 0.6 }
part      = { color = "#2a2a2a", roughness = 0.6 }
ferrite   = { color = "#5a5a58", roughness = 0.6 }
dielectric = { color = "#f2f1ec", roughness = 0.6 }
hole      = { color = "#ededed", roughness = 0.5 }

# The drawn USB-C beside the left edge is under the board in the CAD; it is built below.
[[part]]
name = "DrawnUSBC"
class = "cls-20"
role = "skip"

# Castellated pads (1.7 mm wide) and the battery solder pads are gold in the photos.
[[part]]
name = "Castellations"
class = "cls-5"
min_width_mm = 1.5
max_width_mm = 1.9
material = "enig"

# The three M2 mounting rings, 4.0 mm across (holes 2.15 mm, drawing).
[[part]]
name = "MountRings"
class = "cls-8"
min_width_mm = 3.5
max_width_mm = 4.5
material = "enig"

# The QWIIC (JST SH) is drawn in the SMA's gold; it is natural plastic. Its drawn top goes on its
# blocks. The generator also puts the board's color on top of the blocks, at their height, where
# shapes taken by a rule were, so these sit 0.05 mm higher to show over it.
[[part]]
name = "QWIICTop"
class = "cls-13"
min_width_mm = 2.0
max_width_mm = 4.0
material = "jst"
z = 3.0

[[part]]
name = "QWIICTop"
class = "cls-13"
max_bbox_area_mm2 = 1.5
material = "jst"
z = 3.0

