# thinknode_m2: the flasher's illustration is a front view with the case in the right proportions,
# but it draws the flat antenna round and adds side parts, so this uses our copy of it (drawings/)
# with those taken out, scaled to the measured case, plus the antenna, its collar and the lanyard
# pocket drawn from measurements. Every figure is measured from Elecrow's published STEP, used for
# measurement only:
# https://github.com/Elecrow-RD/ThinkNode-M2-Meshtastic-LoRa-Signal-Transceiver-Powered-By-ESP32-S3-with-1.3-OLED-Display/blob/master/3D%20file/thinknode-m2-20250221.stp
# (sha256 162d66fbc7a0aa63b157df3aebc2143babf027173012729dcc8889fc5c38699e).
# The store says 88.4 x 46 x 23 mm and the datasheet 88.5 x 46.3 x 23.8; the STEP decides:
# 88.5 tall with the antenna (57.0 for the case), 45.0 wide (46.6 over the side buttons) and
# 23.8 deep: a 22.3 mm case plus the 1.5 mm raised face panel. Model frame: x from the center
# line, y up from the bottom, z out of the front with 0 the middle of the case without the panel;
# the STEP's y + 31.5 and z + 1.15 give these (its z is up and -y is the front, turned to match).
drawing = "drawings/thinknode_m2.svg"

[size]
width_mm = 45.0
height_mm = 57.0
depth_mm = 22.3
scale_by = "width"
fit_bbox = [0, 31.5, 45.0, 88.5]  # the case; the antenna stands above it
appendage = "none"
covers = "case without the raised face panel (1.5 mm more) or the side buttons; 88.5 mm tall with the antenna"
source = "https://github.com/Elecrow-RD/ThinkNode-M2-Meshtastic-LoRa-Signal-Transceiver-Powered-By-ESP32-S3-with-1.3-OLED-Display/blob/master/3D%20file/thinknode-m2-20250221.stp"
confidence = "cad"
edge_radius_mm = 3.0
# Small: the raised panel sits inside a rim at the front edge.
front_edge_radius_mm = 1.5

[materials]
port   = { color = "#1d1d1f", roughness = 0.6 }
button = { color = "#2a2a2a", roughness = 0.6 }
foot   = { color = "#262626", roughness = 0.7 }
screw  = { color = "#141414", roughness = 0.5 }
brass  = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }

# The face panel stands 1.5 mm proud of the rim; the screen, status lights and logo sit on it.
[[part]]
name = "Panel"
class = "panel"
h = 1.5

[[part]]
name = "ScreenFrame"
class = "screen-frame"
z = 1.5

[[part]]
name = "Screen"
class = "screen"
z = 1.5

[[part]]
name = "LEDStrip"
class = "led-strip"
z = 1.5

[[part]]
name = "LEDs"
class = "led"
z = 1.6

[[part]]
name = "LEDRed"
class = "led-red"
z = 1.6

[[part]]
name = "Logo"
class = "logo"
z = 1.5

# The flat antenna: a 14.8 x 10 mm collar, then a paddle tapering from 11.7 to 9.6 mm wide and
# from 7.7 to 5.7 mm thick, built at its middle thickness. Centered 7.4 mm left of center.
[[thin]]
bbox = [7.6, 29.5, 22.7, 31.5]
depth_mm = 10.0
z_mm = 1.15
edge_radius_mm = 1.5

[[thin]]
bbox = [9.2, -0.1, 21.1, 29.5]
depth_mm = 6.8
z_mm = 1.15
edge_radius_mm = 2.0

# Right side: the function button and the smaller power button above it, 1.3 mm proud.
[[solid]]
name = "FunctionButton"
material = "button"
center_mm = [23.0, 31.45, 2.0]
size_mm = [1.6, 9.1, 8.7]
radius_mm = 4.3

[[solid]]
name = "PowerButton"
material = "button"
center_mm = [23.0, 40.55, 2.0]
size_mm = [1.6, 8.1, 6.7]
radius_mm = 3.3

# Bottom: USB-C, the reset pinhole to its left and four 0.5 mm feet.
[[solid]]
name = "USBC"
material = "port"
center_mm = [0, -0.1, 6.22]
size_mm = [8.9, 0.4, 3.2]
radius_mm = 1.6

[[solid]]
name = "Reset"
material = "port"
center_mm = [-9.92, -0.1, 5.53]
size_mm = [1.2, 0.4, 1.2]
radius_mm = 0.6

[[solid]]
name = "FootFrontLeft"
material = "foot"
center_mm = [-15.5, -0.25, 8.15]
size_mm = [2.0, 0.5, 2.0]

[[solid]]
name = "FootFrontRight"
material = "foot"
center_mm = [15.5, -0.25, 8.15]
size_mm = [2.0, 0.5, 2.0]

[[solid]]
name = "FootBackLeft"
material = "foot"
center_mm = [-15.5, -0.25, -6.35]
size_mm = [2.0, 0.5, 2.0]

[[solid]]
name = "FootBackRight"
material = "foot"
center_mm = [15.5, -0.25, -6.35]
size_mm = [2.0, 0.5, 2.0]

# Back: four round pads 0.5 mm proud (2 mm across, so it lies flat on its back), four screw
# holes and the two brass assembly nuts.
[[solid]]
name = "PadLowerLeft"
material = "foot"
center_mm = [-18.0, 4.5, -11.4]
size_mm = [2.0, 2.0, 0.5]
radius_mm = 1.0

[[solid]]
name = "PadLowerRight"
material = "foot"
center_mm = [18.0, 4.5, -11.4]
size_mm = [2.0, 2.0, 0.5]
radius_mm = 1.0

[[solid]]
name = "PadUpperLeft"
material = "foot"
center_mm = [-18.0, 52.5, -11.4]
size_mm = [2.0, 2.0, 0.5]
radius_mm = 1.0

[[solid]]
name = "PadUpperRight"
material = "foot"
center_mm = [18.0, 52.5, -11.4]
size_mm = [2.0, 2.0, 0.5]
radius_mm = 1.0

[[solid]]
name = "ScrewLowerLeft"
material = "screw"
center_mm = [-15.0, 6.5, -11.15]
size_mm = [3.5, 3.5, 0.3]
radius_mm = 1.75

[[solid]]
name = "ScrewLowerRight"
material = "screw"
center_mm = [15.0, 6.5, -11.15]
size_mm = [3.5, 3.5, 0.3]
radius_mm = 1.75

[[solid]]
name = "ScrewUpperLeft"
material = "screw"
center_mm = [-15.0, 47.0, -11.15]
size_mm = [3.5, 3.5, 0.3]
radius_mm = 1.75

[[solid]]
name = "ScrewUpperRight"
material = "screw"
center_mm = [15.0, 47.0, -11.15]
size_mm = [3.5, 3.5, 0.3]
radius_mm = 1.75

[[solid]]
