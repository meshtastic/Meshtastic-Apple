# t-echo_plus: LILYGO T-Echo Plus, front view.
# Size: https://www.cnx-software.com/?p=159235
# LILYGO's dimension image gives 89 x 53 x 45 (https://wiki.lilygo.cc/products/t-echo-series/t-echo-plus/);
# the case height is read from the drawing at 53 wide. The 45 takes in the clip loop and SMA: measured
# from LILYGO's side and back photos against the 53 mm front, the case is about 31 mm deep with a back
# cover about 49 x 50 x 8.5 mm over its lower part, about 40 mm overall (estimates from photos).
[size]
width_mm = 53
height_mm = 66.3
depth_mm = 31
scale_by = "width"
fit_bbox = [0.4, 106.8, 289.9, 470.2]
covers = "case; the clip loop above it is built thin"
source = "https://www.cnx-software.com/?p=159235"
confidence = "vendor"
edge_radius_mm = 6.0
front_edge_radius_mm = 3.0

[materials]
case = { color = "#202020", roughness = 0.6 }

# The back cover, stepped out from the case's lower part.
[[solid]]
name = "BackCover"
material = "case"
center_mm = [0.0, 25.0, -19.75]
size_mm = [49.0, 50.0, 8.5]
radius_mm = 5.0
confidence = "estimated from photos"
