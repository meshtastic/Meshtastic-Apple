# rak-wismeshtap: WisMesh TAP, a touchscreen client in RAK's Unify Small enclosure. The flasher's
# illustration is a clean front view and stays the drawing. Depth, outline and the back are
# measured from the Unify Small body in RAK's MIT-licensed drill-guide STEP, used for measurement
# only ("Unified-Small-Enclosure v3" component):
# https://raw.githubusercontent.com/RAKWireless/Awesome-WisBlock/main/Unify-Enclosure/Small-Unifiy-Enclosure/Drill-Guide-USB-Type-C-Hole.step
# (sha256 b28486ccb9cacf0237829f05dc1a8d697f379f9a76098824337f7fcf1c581f10).
# The STEP has the shell only (27.5 mm to the parting line, plan corner radius ~13 mm); the
# screen lid isn't modeled. RAK's top photo of the TAP V2 gives 38.5 mm overall with a 9.7 mm
# lid, which matches the published 38. The sides are read from the V2's photos; the TAP's
# own photos (wismesh-tap.jpg, wismesh-tap-3.png) show the same button and side panel, but no
# straight-on side, so the USB-C position is assumed to match the V2.
# Model frame: x from the center line as seen from the front, y up from the bottom, z out of the
# screen with 0 the middle of the body; the case center is at y 37.85.

[size]
width_mm = 100.0
height_mm = 75.0
depth_mm = 38.0
scale_by = "width"
covers = "enclosure (Unify Small 100 x 75 x 38 with the TAP lid), excludes antenna"
source = "https://store.rakwireless.com/products/wismesh-unify-enclosure"
confidence = "cad"
# Drawn case runs 0.7 mm past 75 at 100 mm wide; build it all full depth.
body_height_mm = 75.8
# The lid and the shell are the gray case; the drawn bezel is the lid's front rim.
body_color = "#9f9f9e"
# The STEP's back edge is a ~0.75 mm fillet on a drafted wall; 1.5 stands in for both.
edge_radius_mm = 1.5
front_edge_radius_mm = 2.0

# Rubber whip on a hinged SMA connector: straight base, then the tilted whip. The connector sits
# 21 mm right of center, mid-depth (top photo).
[[antenna]]
name = "AntennaBase"
start = [1108.0, 857.0]
end = [1108.0, 689.0]

[[antenna]]
name = "AntennaWhip"
start = [1111.2, 687.3]
end = [760.0, 344.0]
dome = true

[materials]
recess = { color = "#87888a", roughness = 0.6 }
dish   = { color = "#7c7d7f", roughness = 0.6 }
pocket = { color = "#2a2b2d", roughness = 0.7 }
brass  = { color = "#c9a24a", roughness = 0.3, metallic = 1.0 }
hole   = { color = "#1d1d1f", roughness = 0.6 }
port   = { color = "#1d1d1f", roughness = 0.6 }
button = { color = "#77787a", roughness = 0.55 }
panel  = { color = "#a6a6a5", roughness = 0.5 }

# Back (the floor of the Unify shell), from the STEP. The shell is 75 x 100 mm at the lid and
# narrows to 71.3 x 96.3 mm at the back with a draft and a ~0.75 mm edge fillet; the generator
# extrudes straight, so the back is full size. Recesses are drawn as thin darker layers.
# Corner screw pockets, ~10 mm square, 22 mm deep, at x +-40.8, y center +-28.3.
[[solid]]
name = "PocketUpperLeft"
material = "pocket"
center_mm = [-40.8, 66.15, -19.1]
size_mm = [10.0, 10.0, 0.2]
radius_mm = 3.0

[[solid]]
name = "PocketUpperRight"
material = "pocket"
center_mm = [40.8, 66.15, -19.1]
size_mm = [10.0, 10.0, 0.2]
radius_mm = 3.0

[[solid]]
name = "PocketLowerLeft"
material = "pocket"
center_mm = [-40.8, 9.55, -19.1]
size_mm = [10.0, 10.0, 0.2]
radius_mm = 3.0

[[solid]]
name = "PocketLowerRight"
material = "pocket"
center_mm = [40.8, 9.55, -19.1]
size_mm = [10.0, 10.0, 0.2]
radius_mm = 3.0

